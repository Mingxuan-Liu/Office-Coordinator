        timestampIso: priorNote.timestampIso
      } : null,
      accommodationMaxChars: ACCOMMODATION_MAX_CHARS,
      concentration: CONCENTRATION,
      identity: {
        sessionEmail: person && params.mockPerson !== 'none' ? person.email : '',
        onRoster: !!person
      },
      warnings: person ? [] : ['This is the mock server: no Google identity was resolved.']
    };
  }

  /* The identity step re-asks this on every candidacy change, and it is the
     SERVER's rule-table evaluation that answers — not a second implementation
     in the browser. Mirrors Code.gs getEligibleZonesForClaim(): the SUBMITTED
     candidacy governs on its own. It used to be intersected with the roster's
     zones, which returned the empty set as soon as a correction crossed the
     cohort boundary — see the note in Code.gs submitRanking(). */
  function resolvedSeed() {
    var year = SCORING.seed_year;
    if (year !== undefined && year !== null && year !== '') {
      if (typeof year === 'string' && year.trim().toLowerCase() === 'auto') {
        return String(new Date().getFullYear());
      }
      return String(year).trim();
    }
    return SCORING.tie_break_seed || '';
  }

  function getEligibleZonesForClaim(claim) {
    if (params.mockFail === 'getEligibleZonesForClaim') {
      throw new Error('Mock failure: getEligibleZonesForClaim.');
    }
    claim = claim || {};
    var person = rosterByEmail(claim.email);
    if (!person) {
      return { ok: false, error: 'That email address is not on the roster.', zones: [] };
    }
    var rosterZones = zonesForAttributes(person);
    var claimed = { candidacy: trim(claim.candidacy) || person.candidacy };
    var claimZones = zonesForAttributes(claimed);
    return {
      ok: true,
      zones: claimZones,
      rosterZones: rosterZones,
      claimZones: claimZones,
      reason: decisionForAttributes(claimed).reason
    };
  }

  /* Re-checks every rule the client checks. The mock is not a security
     boundary, but it has to reject the same things Code.gs rejects or the UI
     gets developed against a lie. */
  function submitRanking(payload) {
    if (params.mockFail === 'submitRanking') {
      throw new Error('Mock failure: submitRanking (remove ?mockFail= to recover).');
    }

    payload = payload || {};

    /* The phase, checked exactly where Code.gs checks it: before anything is
       read or written, and before any other complaint. A preview that let a
       ranking through during the keeping-seats phase would be teaching the
       coordinator that the greyed-out chips are only decoration. */
    if (PHASE === 'prelock') {
      return { ok: false, errors: [rankingClosedMessage()] };
    }

    var errors = [];
    var person = rosterByEmail(payload.email);

    if (!payload.email) { errors.push('No email was submitted.'); }
    else if (!person) { errors.push(payload.email + ' is not on the roster.'); }
    if (!trim(payload.name)) { errors.push('No name was submitted.'); }

    if (!trim(payload.candidacy)) { errors.push('Candidacy is required.'); }

    /* `year` is collected, recorded and then left alone — exactly as in Code.gs.
       It is read here and NOT added to `errors`: an unusable one cannot change
       the outcome, so refusing over it would refuse over nothing. It also never
       reaches `attrs` below, which is what zonesForAttributes() evaluates. */
    var year = positiveInteger(payload.year);
    if (year === null && person) { year = positiveInteger(person.year); }

    if (person && person.keepsDesk) {
      errors.push(person.name + ' is keeping desk ' + person.currentDesk + ' and is not in the pool.');
    }

    var ownClaim = person ? activeClaimFor(person.email) : null;
    if (ownClaim) {
      errors.push('You claimed desk ' + ownClaim.deskId + ' in the pre-lock step and are ' +
        'keeping it, so you are not in the ranking. Release it first.');
    }

    if (Date.now() > Date.parse(DEADLINE_ISO)) {
      errors.push('The form closed on ' + DEADLINE_ISO + '.');
    }

    var choices = isArray(payload.choices) ? payload.choices.map(trim) : [];
    var attrs = { candidacy: payload.candidacy };
    var pool = poolDesksFor(attrs);

    var claimedByOthers = {};
    activeClaims().forEach(function (c) {
      if (!person || c.email !== person.email) { claimedByOthers[c.deskId] = c.name; }
    });

    /* Exactly K, same as Code.gs and SPEC §3.1 — a response row has K choice
       columns and they all have to be filled. */
    if (choices.length !== K) {
      errors.push('Exactly ' + K + ' choices are required, in order; got ' + choices.length + '.');
    }
    if (pool.length < K) {
      errors.push('Only ' + pool.length + ' desks are open to you but ' + K +
        ' are required — the coordinator needs to free up desks or change eligibility.');
    }

    var seen = {};
    choices.forEach(function (id, i) {
      if (!id) { errors.push('Choice ' + (i + 1) + ' is empty.'); return; }
      if (seen[id]) { errors.push(id + ' is ranked more than once.'); }
      seen[id] = true;
      var desk = deskById(id);
      if (!desk) { errors.push(id + ' is not a desk in rooms.json.'); return; }
      if (lockedIds().indexOf(id) >= 0) { errors.push(id + ' is held by someone keeping their desk.'); }
      else if (has(claimedByOthers, id)) {
        errors.push(id + ' was claimed by ' + claimedByOthers[id] + ' in the pre-lock step.');
      }
      else if (!desk.available) { errors.push(id + ' is not in the pool this year.'); }
      else if (zonesForAttributes(attrs).indexOf(desk.zone) < 0) {
        errors.push(id + ' is in the ' + (ROOMS.zones[desk.zone] || {}).label + ', which is not open to you.');
      }
    });

    if (errors.length) { return { ok: false, errors: errors }; }

    /* The note is read but never judged: it cannot be invalid and cannot stop
       a ranking being saved, so it is deliberately not in `errors` above. */
    var note = normaliseNote(payload.accommodation);

    /* The response record. Unchanged by this feature, and it must stay that
       way: `accommodation` is NOT a key here, it is a row in another store. */
    var record = {
      submissionId: freshId(),
      timestampIso: new Date().toISOString(),
      email: lower(payload.email),
      name: trim(payload.name),
      candidacy: trim(payload.candidacy),
      year: year === null ? '' : year,   // recorded; blank when there is no usable one
      choices: choices,
      authMethod: payload.authMethod || 'self_select',
      clientVersion: payload.clientVersion || 'unknown'
    };
    var all = readSubmissions();
    all.push(record);
    writeSubmissions(all);

    var noteWrite = recordNote(record.email, record.name, note.text,
                               record.clientVersion, record.timestampIso);

    return {
      ok: true,
      submissionId: record.submissionId,
      timestampIso: record.timestampIso,
      noteRecorded: noteWrite.recorded,
      noteWithdrawn: noteWrite.withdrawn,
      noteTruncated: note.truncated,
      noteError: ''
    };
  }

  /* Same shape and the same refusals as Code.gs claimDesk(). The mock has no
     lock to take, but it does re-read the claim log before writing, which is
     the check the lock exists to protect. */
  function claimDesk(payload) {
    if (params.mockFail === 'claimDesk') {
      throw new Error('Mock failure: claimDesk (remove ?mockFail= to recover).');
    }

    payload = payload || {};
    var keeping = payload.keeping !== false;
    var errors = [];

    if (!PRELOCK_ENABLED) {
      return { ok: false, errors: ['The stage for keeping your current desk is not ' +
        'open, so nothing was saved. Rank your desks as normal — that is the step ' +
        'that is live now.'] };
    }
    if (Date.now() > Date.parse(DEADLINE_ISO)) {
      return { ok: false, errors: ['The form closed on ' + DEADLINE_ISO + '.'] };
    }
    if (prelockPassed()) {
      return { ok: false, errors: ['The deadline for keeping your current desk passed on ' +
        PRELOCK_DEADLINE_ISO + '.'] };
    }

    var person = rosterByEmail(payload.email);
    if (!payload.email) { errors.push('No email was submitted.'); }
    else if (!person) { errors.push(payload.email + ' is not on the roster.'); }

    var deskId = trim(payload.deskId);
    var desk = deskId ? deskById(deskId) : null;
    if (!deskId) { errors.push('No desk was named.'); }
    else if (!desk) { errors.push(deskId + ' is not a desk in rooms.json.'); }
    else if (keeping && !desk.available) {
      errors.push(deskId + ' is not in the pool this year.');
    } else if (keeping && lockedIds().indexOf(deskId) >= 0) {
      errors.push(deskId + ' is already down on the roster as kept by somebody else.');
    }
    if (errors.length) { return { ok: false, errors: errors }; }

    var held = null;
    activeClaims().forEach(function (c) { if (c.deskId === deskId) { held = c; } });
    if (keeping && held && held.email !== lower(payload.email)) {
      return { ok: false, errors: [held.name + ' claimed desk ' + deskId + ' first.'] };
    }
    if (!keeping) {
      var own = activeClaimFor(payload.email);
      if (!own) { return { ok: false, errors: ['You are not currently keeping a desk.'] }; }
      if (own.deskId !== deskId) {
        return { ok: false, errors: ['You are keeping desk ' + own.deskId + ', not ' + deskId + '.'] };
      }
    }

    var row = {
      claimId: freshId(),
      timestampIso: new Date().toISOString(),
      email: lower(payload.email),
      name: trim(payload.name) || (person ? person.name : ''),
      deskId: desk.id,
      keeping: keeping,
      clientVersion: payload.clientVersion || 'unknown'
    };
    var rows = storedClaimRows();
    rows.push(row);
    writeClaimRows(rows);

    return {
      ok: true,
      claimId: row.claimId,
      timestampIso: row.timestampIso,
      deskId: row.deskId,
      keeping: keeping
    };
  }

  global.MOCK_SERVER = {
    latencyMs: params.mockLatency !== undefined ? (parseInt(params.mockLatency, 10) || 0) : 220,
    getBootstrap: getBootstrap,
    getEligibleZonesForClaim: getEligibleZonesForClaim,
    submitRanking: submitRanking,
    claimDesk: claimDesk,
    __state: function () {
      return {
        k: K, desks: DESKS.length, zones: ZONE_IDS, roster: ROSTER.length,
        pool: POOL_PEOPLE.length, locked: LOCKED, deadline: DEADLINE_ISO,
        phase: PHASE,
        prelock: { enabled: PRELOCK_ENABLED, deadline: PRELOCK_DEADLINE_ISO },
        claims: activeClaims(),
        submissions: readSubmissions(),
        /* The private tab, as the coordinator would see it. Dev only — in the
           real deployment this is a separate sheet nobody else can open. */
        accommodations: readNotes()
      };
    },
    __reset: function () {
      writeSubmissions([]);
      writeClaimRows([]);
      writeNotes([]);
      global.location.reload();
    }
  };

  if (global.console && console.info) {
    console.info(
      '%c[deskmatch] mock server active%c\n' +
      DESKS.length + ' desks, ' + ZONE_IDS.length + ' zones, K=' + K + ', ' +
      ROSTER.length + ' roster members, ' + LOCKED.length + ' desks held.\n' +
      'PHASE: ' + PHASE + ' — ' +
      (PRELOCK_ENABLED
        ? 'keeping seats. Choose and Confirm are shut; ' + activeClaims().length + ' claimed.'
        : 'ranking. Pre-lock is shut; ' + activeClaims().length +
          ' claim(s) still enforced.') + '\n' +
      'Switches: ?mockPerson=none|<email>  ?mockSubmitted=1  ?mockDeadline=past|soon|far  ' +
      '?mockLatency=<ms>  ?mockFail=getBootstrap|submitRanking|claimDesk  ?mockLocked=<n>\n' +
      '          ?mockPrelock=on|off  ?mockPrelockDeadline=past|soon|far  ?mockClaims=<n>\n' +
      'MOCK_SERVER.__state() / MOCK_SERVER.__reset()',
      'font-weight:bold', 'font-weight:normal'
    );
  }
}(window));
</script>
