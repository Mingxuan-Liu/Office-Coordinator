<!-- ==========================================================================
     Local-preview bootstrap.

     Under Apps Script the include() scriptlets above have already inlined every
     partial, so this block detects that and does nothing. (Do not write a
     literal scriptlet in a comment anywhere in this file: HtmlService scans the
     raw template text and would try to evaluate it.)

     Opened outside Apps Script (e.g. `python3 -m http.server` inside frontend/)
     the scriptlets are inert HTML comments, so we fetch the same partials over
     HTTP in the same order and inject them, plus mock_server.html which stands
     in for google.script.run. mock_server.html is referenced ONLY from here, so
     it never needs to be pushed to Apps Script.
     ========================================================================== -->
<script>
(function () {
  'use strict';
  if (document.getElementById('deskmatch-style')) { return; }   // server-rendered

  window.__DESKMATCH_DEFER_BOOT__ = true;

  /* Same execution order as the server-rendered page: core first, then the
     views (whose inline scripts call APP.on), then the view modules. */
  var PARTIALS = [
    { file: 'Style.html',        into: 'head' },
    { file: 'mock_server.html',  into: 'body' },
    { file: 'JsCore.html',       into: 'body' },
    { file: 'ViewLogin.html',    into: '#main' },
    { file: 'ViewExplainer.html',into: '#main' },
    { file: 'ViewSelect.html',   into: '#main' },
    { file: 'ViewConfirm.html',  into: '#main' },
    { file: 'JsMap.html',        into: 'body' },
    { file: 'JsExplainer.html',  into: 'body' }
  ];

  function target(sel) {
    if (sel === 'head') { return document.head; }
    if (sel === 'body') { return document.body; }
    return document.querySelector(sel) || document.body;
  }

  function inject(html, host) {
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    var nodes = Array.prototype.slice.call(tpl.content.childNodes);
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (node.nodeName === 'SCRIPT') {
        var s = document.createElement('script');
        for (var a = 0; a < node.attributes.length; a++) {
          s.setAttribute(node.attributes[a].name, node.attributes[a].value);
        }
        s.text = node.textContent;
        host.appendChild(s);
      } else {
        host.appendChild(node);
      }
    }
  }

  function fail(file, err) {
    var msg = document.getElementById('boot-msg');
    if (msg) {
      msg.innerHTML =
        'Local preview could not load <code>' + file + '</code>.<br>' +
        '<small>' + String(err && err.message ? err.message : err) + '</small><br><br>' +
        'Serve the folder over HTTP instead of opening the file directly:<br>' +
        '<code>cd frontend &amp;&amp; python3 -m http.server 8080</code>';
    }
    document.body.setAttribute('data-loading', '0');
  }

  var chain = Promise.resolve();
  PARTIALS.forEach(function (p) {
    chain = chain.then(function () {
      return fetch(p.file, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) { throw new Error(r.status + ' ' + r.statusText); }
        return r.text();
      }).then(function (text) {
        inject(text, target(p.into));
      }).catch(function (err) {
        fail(p.file, err);
        throw err;
      });
    });
  });

  chain.then(function () {
    document.documentElement.setAttribute('data-preview', 'local');
    if (window.APP && typeof window.APP.boot === 'function') { window.APP.boot(); }
  }).catch(function () { /* already surfaced by fail() */ });
}());
</script>
