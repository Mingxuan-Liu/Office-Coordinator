<script>
/* ==========================================================================
   JsMap — floor plan renderer, desk interaction, ranked list, validation.

   Owns everything inside #view-select. Reads the world exclusively through
   window.APP (JsCore): APP.rooms(), APP.desks(), APP.deskStatus(), APP.K,
   APP.zones(), APP.concentration(). Nothing here knows how many desks, zones,
   rooms, ranks or people exist, what the zones are called, or which coordinate
   space the plan uses — all of that comes from bootstrap.rooms verbatim.

   TWO MODES, ONE RENDERER
   -----------------------
   'rank'   the Choose step: tap desks to build a ranking of K of them.
   'single' the Pre-lock step: tap ONE desk — the one you are sitting at and
            want to keep — and nothing else on the page changes.

   The pre-lock view does not own a second map. It calls APP.map.mount(slot),
   which moves the one #map-wrap element into its own container and flips the
   mode; APP.map.unmount() puts it back. Every element id stays what it was, so
   every listener, every measurement and every line of drawing code below is
   shared. There is one floor-plan renderer in this repository and this is it.

   The only numeric literals below are rendering constants (a 44px touch
   target, a zoom ceiling, a double-tap window). None of them describes the
   size of the problem.
   ========================================================================== */
(function (global, doc) {
  'use strict';

  var APP = global.APP;
  if (!APP) {
    if (global.console) { console.error('[deskmatch] JsMap loaded before JsCore.'); }
    return;
  }

  var U = APP.util;
  var esc = U.esc;
  var ordinal = U.ordinal;
  var toArray = U.toArray;

  var SVGNS = 'http://www.w3.org/2000/svg';

  /* Rendering constants. Not problem dimensions. */
  var MIN_TAP_PX     = 44;     /* smallest comfortable finger target */
  var MIN_LABEL_PX   = 11;     /* smallest desk number worth calling legible */
  var MIN_STAGE_PX   = 128;    /* never shrink the plan viewport below this */
  var ZOOM_DEADBAND  = 1.15;   /* below this an opening zoom is not worth it */
  var MAX_ZOOM       = 10;
  var ZOOM_STEP      = 1.6;
  var DBLTAP_MS      = 320;
  var DBLTAP_PX      = 30;
  var DBLTAP_ZOOM    = 2.75;
  var AUTOSCROLL_EDGE  = 76;
  var AUTOSCROLL_SPEED = 16;
  var NOMINAL_CANVAS = 1000;   /* fallback canvas when image_size is absent */
  var HOT_SHARE      = 0.5;    /* share of picks that must be in demand to warn */

  /* ----------------------------------------------------------------------
     Tiny helpers
     ---------------------------------------------------------------------- */

  function $(id) { return doc.getElementById(id); }
  function isArr(v) { return Object.prototype.toString.call(v) === '[object Array]'; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : NaN; }
  function clamp(lo, v, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function closest(node, sel) { return (node && node.closest) ? node.closest(sel) : null; }

  function mk(tag, attrs) {
    var n = doc.createElementNS(SVGNS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) { continue; }
        var v = attrs[k];
        if (v === null || v === undefined) { continue; }
        if (k === 'text') { n.textContent = String(v); }
        else { n.setAttribute(k, String(v)); }
      }
    }
    return n;
  }

  function coarsePointer() {
    try { return !!(global.matchMedia && global.matchMedia('(pointer: coarse)').matches); }
    catch (e) { return false; }
  }

  /* `hidden` is an HTML attribute and does nothing to an SVG element, so SVG
     visibility is toggled through inline display instead. */
  function svgShow(node, on) {
    if (node) { node.style.display = on ? '' : 'none'; }
  }

  /* Announcements go to the live region of the view the map is showing in; a
     region inside a hidden view is never read out. */
  function live(msg) {
    var n = $(liveId) || $('select-live');
    if (n) { n.textContent = msg || ''; }
  }

  /* ----------------------------------------------------------------------
     Icons
     ---------------------------------------------------------------------- */

  var IC = {
    grip: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' +
          '<circle cx="7.5" cy="5" r="1.4"/><circle cx="12.5" cy="5" r="1.4"/>' +
          '<circle cx="7.5" cy="10" r="1.4"/><circle cx="12.5" cy="10" r="1.4"/>' +
          '<circle cx="7.5" cy="15" r="1.4"/><circle cx="12.5" cy="15" r="1.4"/></svg>',
    up:   '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M10 15.5V5M5.5 9.5 10 5l4.5 4.5"/></svg>',
    down: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M10 4.5V15M5.5 10.5 10 15l4.5-4.5"/></svg>',
    x:    '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9"/></svg>'
  };

  /* ----------------------------------------------------------------------
     Module state
     ---------------------------------------------------------------------- */

  var activeRoomId = null;
  var geom = null;            /* geometry of the room currently drawn */
  var deskNodes = {};         /* desk id -> node record, active room only */
  var deskOrder = [];         /* desk ids in the active room, config order */
  var featureRecs = [];       /* drawn features, config order, active room only */
  var featureLayer = null;    /* the <g> holding them */
  var focusDeskId = null;     /* roving tabindex owner */
  var linkedId = null;
  var builtFor = null;        /* room id the SVG currently shows */
  var pendingFocus = null;
  var tipEl = null;
  var tipFor = null;
  var tipFeatureId = null;
  var drag = null;
  var lastTap = { t: 0, x: 0, y: 0 };
  var pinch = null;
  var wired = false;
  var view = { zoom: 1, fitW: 0, maxH: 0, autoZoomDone: false };

  /* --- mode ------------------------------------------------------------- */

  var MODE_RANK = 'rank';
  var MODE_SINGLE = 'single';

  var mode = MODE_RANK;
  var hostView = 'select';    /* the view the map is currently living in */
  var liveId = 'select-live'; /* the live region to announce into */
  var mapHome = null;         /* where to put #map-wrap back */
  var defaultHint = null;     /* #map-hint as ViewSelect authored it */
  var single = { id: null, onPick: null, hint: '' };

  function isSingle() { return mode === MODE_SINGLE; }

  /* Whether this desk can be acted on right now, in whichever mode is running.
     Everything that paints, announces or reacts goes through here so the two
     modes cannot drift apart. */
  function statusOf(id) {
    return isSingle() ? claimStatus(id) : APP.deskStatus(id);
  }

  /* Pre-lock eligibility. Deliberately NOT the same test as ranking: the zone
     rules say where somebody may be *assigned*, and staying at the desk you
     already occupy is not an assignment. So a claim is refused only when the
     desk does not exist, is out of the pool, or belongs to somebody else —
     which is exactly what the server re-checks. Sitting outside your zone is
     surfaced as a note on the tooltip instead of a refusal. */
  function claimStatus(id) {
    var d = APP.deskById(id);
    if (!d) { return { ok: false, code: 'unknown', reason: 'That desk is not on the floor plan.' }; }
    if (!d.available) {
      return { ok: false, code: 'unavailable', reason: 'This desk is not in the pool this year.' };
    }
    var held = (typeof APP.claimHolder === 'function') ? APP.claimHolder(id) : null;
    if (held && held.isMine) { return { ok: true, code: 'ok', reason: '' }; }
    if (held) {
      return { ok: false, code: 'locked', reason: held.name + ' has already claimed this desk.' };
    }
    var roster = APP.deskStatus(id);
    if (roster.code === 'locked' || roster.code === 'unavailable') { return roster; }
    return { ok: true, code: 'ok', reason: '' };
  }

  /* True when this desk is one the person could never be *assigned*, which is
     worth saying out loud on the pre-lock step even though it does not stop
     them keeping it. */
  function outsideMyZones(id) {
    var d = APP.deskById(id);
    var person = APP.state.person;
    var zones = person && person.allowedZones;
    return !!(d && isArr(zones) && zones.length && zones.indexOf(d.zone) < 0);
  }

  /* ----------------------------------------------------------------------
     Geometry — coordinate space, shapes, view box
     ---------------------------------------------------------------------- */

  function roomsList() { return APP.rooms(); }

  function roomById(id) {
    var list = roomsList();
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(id)) { return list[i]; }
    }
    return null;
  }

  function roomDesks(room) {
    if (!room) { return []; }
    var all = APP.desks();
    var out = [];
    for (var i = 0; i < all.length; i++) {
      if (String(all[i].roomId) === String(room.id)) { out.push(all[i]); }
    }
    return out;
  }

  /* Walks a list of [x,y] pairs into view-box units. Shared by polygon and
     polyline so the two cannot drift apart. Returns null when fewer than
     `minPts` of the pairs were usable. */
  function pathGeom(list, sx, sy, minPts) {
    var pts = [];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var cx = 0, cy = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!isArr(p) || p.length < 2) { continue; }
      var px = num(p[0]) * sx, py = num(p[1]) * sy;
      if (isNaN(px) || isNaN(py)) { continue; }
      pts.push([px, py]);
      if (px < minX) { minX = px; }
      if (py < minY) { minY = py; }
      if (px > maxX) { maxX = px; }
      if (py > maxY) { maxY = py; }
      cx += px; cy += py;
    }
    if (pts.length < minPts) { return null; }
    return {
      points: pts,
      bbox: { x: minX, y: minY, w: maxX - minX, h: maxY - minY },
      center: { x: cx / pts.length, y: cy / pts.length }
    };
  }

  /* Converts one shape into view-box units, whatever the config used.
     Supports rect [x,y,w,h] and polygon [[x,y],...], in normalized or pixel
     space, plus polyline [[x,y],...] when `allowOpen` is set.

     Only features pass `allowOpen`. A polyline has no interior, so it can be
     stroked but never filled and never tapped, which is exactly why it is not
     a legal desk shape. Returns null for a shape the config did not actually
     provide. */
  function convertShape(shape, sx, sy, allowOpen) {
    if (!shape || typeof shape !== 'object') { return null; }

    if (isArr(shape.rect) && shape.rect.length >= 4) {
      var x = num(shape.rect[0]) * sx;
      var y = num(shape.rect[1]) * sy;
      var w = num(shape.rect[2]) * sx;
      var h = num(shape.rect[3]) * sy;
      if (isNaN(x) || isNaN(y) || isNaN(w) || isNaN(h)) { return null; }
      /* Negative width/height is legal-ish input; normalise it. */
      if (w < 0) { x += w; w = -w; }
      if (h < 0) { y += h; h = -h; }
      return {
        kind: 'rect',
        closed: true,
        rect: { x: x, y: y, w: w, h: h },
        points: [[x, y], [x + w, y], [x + w, y + h], [x, y + h]],
        bbox: { x: x, y: y, w: w, h: h },
        center: { x: x + w / 2, y: y + h / 2 }
      };
    }

    if (isArr(shape.polygon) && shape.polygon.length >= 3) {
      var poly = pathGeom(shape.polygon, sx, sy, 3);
      if (!poly) { return null; }
      poly.kind = 'poly';
      poly.closed = true;
      return poly;
    }

    if (allowOpen && isArr(shape.polyline) && shape.polyline.length >= 2) {
      var line = pathGeom(shape.polyline, sx, sy, 2);
      if (!line) { return null; }
      line.kind = 'polyline';
      line.closed = false;
      return line;
    }

    return null;
  }

  function computeGeom(room) {
    var space = APP.coordSpace() === 'pixels' ? 'pixels' : 'normalized';
    var size = room && room.image_size;
    var iw = isArr(size) ? num(size[0]) : NaN;
    var ih = isArr(size) ? num(size[1]) : NaN;
    var haveSize = iw > 0 && ih > 0;

    /* Multiplier that turns a config coordinate into a view-box unit. */
    var sx, sy;
    if (space === 'pixels') { sx = 1; sy = 1; }
    else { sx = haveSize ? iw : NOMINAL_CANVAS; sy = haveSize ? ih : NOMINAL_CANVAS; }

    var desks = roomDesks(room);
    var shapes = {};
    var deskBoxes = [];
    var bad = [];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var minMinor = Infinity;

    function grow(b) {
      if (b.x < minX) { minX = b.x; }
      if (b.y < minY) { minY = b.y; }
      if (b.x + b.w > maxX) { maxX = b.x + b.w; }
      if (b.y + b.h > maxY) { maxY = b.y + b.h; }
    }

    desks.forEach(function (d) {
      var s = convertShape(d.shape, sx, sy);
      if (!s) { bad.push(d.id); return; }
      shapes[d.id] = s;
      deskBoxes.push(s.bbox);
      grow(s.bbox);
      var minor = Math.min(s.bbox.w, s.bbox.h);
      /* minMinor sizes the touch-target auto-zoom, so only desks count: a
         hairline wall must never make the whole plan zoom in. */
      if (minor > 0 && minor < minMinor) { minMinor = minor; }
    });

    /* Structural decoration: walls, doors, rooms, windows, partitions,
       furniture and the room outline. Never selectable, never in the solve,
       so a feature this renderer cannot understand is skipped rather than
       reported — losing a wall does not stop anyone ranking a desk. */
    var featureList = (room && isArr(room.features)) ? room.features : [];
    var features = [];
    featureList.forEach(function (f, i) {
      if (!f || typeof f !== 'object') { return; }
      var s = convertShape(f.shape, sx, sy, true);
      if (!s) { return; }
      features.push({
        id: String(f.id == null || f.id === '' ? ('feature-' + i) : f.id),
        kind: String(f.kind == null ? '' : f.kind).toLowerCase().replace(/\s+/g, ''),
        label: f.label == null ? '' : String(f.label),
        note: f.note == null ? '' : String(f.note),
        swing: String(f.swing == null ? '' : f.swing).toLowerCase().replace(/\s+/g, ''),
        s: s
      });
      grow(s.bbox);
    });

    var vb;
    if (haveSize && space !== 'pixels') {
      vb = { x: 0, y: 0, w: iw, h: ih };
    } else if (haveSize) {
      vb = { x: 0, y: 0, w: iw, h: ih };
    } else if (isFinite(minX)) {
      var spanX = Math.max(maxX - minX, 1);
      var spanY = Math.max(maxY - minY, 1);
      var pad = Math.max(spanX, spanY) * 0.09;
      vb = { x: minX - pad, y: minY - pad, w: spanX + pad * 2, h: spanY + pad * 2 };
    } else {
      vb = { x: 0, y: 0, w: NOMINAL_CANVAS, h: NOMINAL_CANVAS };
    }

    return {
      roomId: room ? room.id : null,
      space: space,
      haveSize: haveSize,
      vb: vb,
      ratio: vb.h / vb.w,
      shapes: shapes,
      deskBoxes: deskBoxes,
      features: features,
      badShapes: bad,
      minMinor: isFinite(minMinor) ? minMinor : Math.min(vb.w, vb.h) * 0.05,
      unit: Math.max(vb.w, vb.h) / 200      /* one "hairline" in view units */
    };
  }

  /* ----------------------------------------------------------------------
     SVG construction

     There is no floor-plan bitmap anywhere in this renderer, and no code path
     that looks for one. The plan IS the geometry in rooms.json: `image_size`
     survives as the coordinate space those numbers are fractions of, and
     nothing else. A room drawing itself from its own desk rectangles is the
     intended, shipped state, so it is drawn without comment — no image
     element, no load or error handling, and no banner announcing a file that
     was never supposed to exist.
     ---------------------------------------------------------------------- */

  function buildDefs(g) {
    var defs = mk('defs');
    var p = Math.max(4, g.vb.w / 150);          /* texture period, view units */

    /* Diagonal hatch — "someone is keeping this desk". */
    var hatch = mk('pattern', {
      id: 'dm-pat-locked', width: p, height: p,
      patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'
    });
    hatch.appendChild(mk('rect', { width: p, height: p, style: 'fill: var(--sunken)' }));
    hatch.appendChild(mk('rect', {
      width: p * 0.34, height: p, style: 'fill: var(--line-2)'
    }));
    defs.appendChild(hatch);

    /* Stipple — "not open to you". Deliberately a different texture family
       from the hatch so the two read apart in greyscale. */
    var dots = mk('pattern', {
      id: 'dm-pat-ineligible', width: p, height: p, patternUnits: 'userSpaceOnUse'
    });
    dots.appendChild(mk('rect', { width: p, height: p, style: 'fill: var(--surface-2)' }));
    dots.appendChild(mk('circle', {
      cx: p * 0.25, cy: p * 0.25, r: p * 0.15, style: 'fill: var(--line-2)'
    }));
    dots.appendChild(mk('circle', {
      cx: p * 0.75, cy: p * 0.75, r: p * 0.15, style: 'fill: var(--line-2)'
    }));
    defs.appendChild(dots);

    /* Graph paper: the ground the plan is drawn on. */
    var gp = Math.max(8, g.vb.w / 26);
    var grid = mk('pattern', {
      id: 'dm-pat-grid', width: gp, height: gp, patternUnits: 'userSpaceOnUse'
    });
    grid.appendChild(mk('path', {
      d: 'M ' + gp + ' 0 L 0 0 L 0 ' + gp,
      'vector-effect': 'non-scaling-stroke',
      style: 'fill: none; stroke: var(--line); stroke-width: 1'
    }));
    defs.appendChild(grid);

    return defs;
  }

  /* A padlock, drawn in a 0..1 box and scaled onto the desk. */
  function lockGlyph(cx, cy, size) {
    var s = size, x = cx - s / 2, y = cy - s / 2;
    var g = mk('g', {
      class: 'desk__glyph desk__glyph--lock',
      transform: 'translate(' + x + ',' + y + ') scale(' + s + ')'
    });
    g.appendChild(mk('path', { d: 'M0.28 0.46 V0.31 a0.22 0.22 0 0 1 0.44 0 V0.46' }));
    g.appendChild(mk('rect', {
      x: 0.14, y: 0.46, width: 0.72, height: 0.44, rx: 0.09,
      class: 'desk__glyph--fill'
    }));
    return g;
  }

  /* A no-entry sign: circle plus bar. */
  function banGlyph(cx, cy, size) {
    var s = size, x = cx - s / 2, y = cy - s / 2;
    var g = mk('g', {
      class: 'desk__glyph desk__glyph--ban',
      transform: 'translate(' + x + ',' + y + ') scale(' + s + ')'
    });
    g.appendChild(mk('circle', { cx: 0.5, cy: 0.5, r: 0.42 }));
    g.appendChild(mk('path', { d: 'M0.2 0.8 L0.8 0.2' }));
    return g;
  }

  function shapeNode(s) {
    if (s.kind === 'rect') {
      return mk('rect', {
        x: s.rect.x, y: s.rect.y, width: s.rect.w, height: s.rect.h,
        rx: Math.min(s.rect.w, s.rect.h) * 0.12
      });
    }
    var d = '';
    for (var i = 0; i < s.points.length; i++) {
      d += (i === 0 ? 'M' : 'L') + s.points[i][0] + ' ' + s.points[i][1] + ' ';
    }
    return mk('path', { d: d + 'Z' });
  }

  /* ----------------------------------------------------------------------
     Structural features

     Decoration, drawn beneath the desks: walls, doors, windows, partitions,
     furniture, named rooms, the room outline and dividers. They exist so a
     student can see which desk is by the window and which backs onto the
     telecom closet.

     Three rules hold for everything in here, and the rest of the file depends
     on them: features are never clickable (the layer is pointer-events: none
     both in CSS and inline, so no stylesheet accident can revive it), they
     never enter the accessibility tree, and they never appear as a selectable
     state. `kind` comes from the config and is not a closed set — an unknown
     kind draws as generic structure rather than throwing.
     ---------------------------------------------------------------------- */

  /* Rough advance width of one character, in em, for a semibold sans face.
     Only ever used to decide whether a label fits; being a little pessimistic
     here means a label is skipped rather than spilling over its shape. */
  var LABEL_EM = 0.56;

  function geomNode(s, cls) {
    var n;
    if (s.kind === 'rect') {
      n = mk('rect', { x: s.bbox.x, y: s.bbox.y, width: s.bbox.w, height: s.bbox.h });
    } else {
      var d = '';
      for (var i = 0; i < s.points.length; i++) {
        d += (i === 0 ? 'M' : 'L') + s.points[i][0] + ' ' + s.points[i][1] + ' ';
      }
      n = mk('path', { d: s.closed ? d + 'Z' : d });
    }
    n.setAttribute('class', cls);
    return n;
  }

  /* The centre line of a box, along whichever side is longer. */
  function centreLine(b) {
    if (b.w >= b.h) {
      var y = b.y + b.h / 2;
      return [b.x, y, b.x + b.w, y];
    }
    var x = b.x + b.w / 2;
    return [x, b.y, x, b.y + b.h];
  }

  /* Two rails inset along the long axis — how glazing is drawn on a plan. */
  function windowRails(b) {
    if (b.w >= b.h) {
      return [
        [b.x, b.y + b.h * 0.3, b.x + b.w, b.y + b.h * 0.3],
        [b.x, b.y + b.h * 0.7, b.x + b.w, b.y + b.h * 0.7]
      ];
    }
    return [
      [b.x + b.w * 0.3, b.y, b.x + b.w * 0.3, b.y + b.h],
      [b.x + b.w * 0.7, b.y, b.x + b.w * 0.7, b.y + b.h]
    ];
  }

  function segNode(seg, cls) {
    return mk('line', { class: cls, x1: seg[0], y1: seg[1], x2: seg[2], y2: seg[3] });
  }

  /* Which corner of the opening the door is hinged on, as the unit steps from
     that corner into the box: `dx` is which way the arc runs, `dy` is which
     way the leaf stands. "sw" — bottom-left — is the default, and is what a
     door with no `swing` in rooms.json has always drawn as.

     A closed set, unlike `kind`: a swing this build does not recognise is a
     typo for one of four things, and guessing at it would silently draw the
     door opening the wrong way, which is worse than drawing the default. */
  var DOOR_SWINGS = {
    sw: { corner: [0, 1], dx:  1, dy: -1 },
    se: { corner: [1, 1], dx: -1, dy: -1 },
    nw: { corner: [0, 0], dx:  1, dy:  1 },
    ne: { corner: [1, 0], dx: -1, dy:  1 }
  };
  var DOOR_SWING_DEFAULT = 'sw';

  /* Leaf plus quarter-circle swing. A hint, not a survey: rooms.json records
     which corner the door is hinged on, not the angle it happens to be left
     open at.

     The arc is mirrored with the hinge rather than merely restarted somewhere
     else — the leaf stands on one edge of the corner, the arc sweeps a true
     quarter circle from its tip round to the other edge, and the sweep flag
     flips with the handedness of the corner. Both diagonals therefore read as
     mirror images, which is exactly what reversing a door means. */
  function doorSwing(b, swing) {
    var g = mk('g', { class: 'feature__door' });
    var r = Math.min(b.w, b.h);
    if (!(r > 0)) { return g; }

    var key = Object.prototype.hasOwnProperty.call(DOOR_SWINGS, swing)
      ? swing : DOOR_SWING_DEFAULT;
    var sw = DOOR_SWINGS[key];
    g.setAttribute('data-swing', key);

    var hx = b.x + sw.corner[0] * b.w;      /* the hinge */
    var hy = b.y + sw.corner[1] * b.h;
    var tipX = hx, tipY = hy + sw.dy * r;   /* open end of the leaf */
    var endX = hx + sw.dx * r, endY = hy;   /* where the swing closes to */

    /* Clockwise on screen for one diagonal, anticlockwise for the other. */
    var sweep = (sw.dx * sw.dy < 0) ? 1 : 0;

    g.appendChild(mk('path', {
      class: 'feature__line feature__line--hair',
      d: 'M ' + tipX + ' ' + tipY + ' A ' + r + ' ' + r + ' 0 0 ' + sweep +
         ' ' + endX + ' ' + endY
    }));
    g.appendChild(segNode([hx, hy, tipX, tipY], 'feature__leaf'));
    return g;
  }

  function drawFeature(node, f) {
    var s = f.s;

    /* An open path has no interior, so it is stroked whatever the kind says —
       a dashed one when the kind is an annotation rather than a thing. */
    if (s.kind === 'polyline') {
      node.appendChild(geomNode(s, f.kind === 'divider' ? 'feature__dash' : 'feature__line'));
      return;
    }

    switch (f.kind) {
      case 'outline':
      case 'wall':
        node.appendChild(geomNode(s, 'feature__line'));
        return;
      case 'window':
        node.appendChild(geomNode(s, 'feature__line feature__line--hair'));
        windowRails(s.bbox).forEach(function (seg) {
          node.appendChild(segNode(seg, 'feature__accent'));
        });
        return;
      case 'door':
        node.appendChild(doorSwing(s.bbox, f.swing));
        return;
      case 'partition':
        node.appendChild(geomNode(s, 'feature__bar'));
        return;
      case 'divider':
        /* An annotation, not a wall — see the note on zone_divider. */
        node.appendChild(segNode(centreLine(s.bbox), 'feature__dash'));
        return;
      case 'furniture':
        node.appendChild(geomNode(s, 'feature__fill'));
        node.appendChild(geomNode(s, 'feature__line feature__line--hair'));
        return;
      case 'room':
        node.appendChild(geomNode(s, 'feature__wash'));
        node.appendChild(geomNode(s, 'feature__line feature__line--hair'));
        return;
      default:
        /* A kind this build has never heard of still reads as structure. */
        node.appendChild(geomNode(s, 'feature__line'));
    }
  }

  /* --- labels ----------------------------------------------------------- */

  /* Smaller than a desk number, and derived from the desks in this room, so it
     is right on a 1232px plan and on a 531px one without knowing either. */
  function featureLabelSize(g) {
    var minors = g.deskBoxes.map(function (b) { return Math.min(b.w, b.h); })
                            .sort(function (a, b) { return a - b; });
    if (!minors.length) { return g.unit * 2.4; }
    var mid = minors[Math.floor(minors.length / 2)];
    return clamp(g.unit * 1.6, mid * 0.2, g.unit * 6);
  }

  function labelBox(text, cx, cy, fs) {
    var w = Math.max(1, String(text).length) * fs * LABEL_EM;
    var h = fs * 1.15;
    return { x: cx - w / 2, y: cy - h / 2, w: w, h: h };
  }

  function boxesOverlap(a, b, pad) {
    return !(a.x + a.w + pad <= b.x || b.x + b.w + pad <= a.x ||
             a.y + a.h + pad <= b.y || b.y + b.h + pad <= a.y);
  }

  /* Where this feature's label can go, or null for "nowhere it fits".
     Skipping is the correct outcome: a name spilling over its own shape, or
     sitting on top of a desk number, is worse than no name at all. `placed`
     accumulates the boxes already taken, so labels do not stack either. */
  function placeFeatureLabel(f, g, baseFs, placed) {
    var text = f.label;
    if (!text) { return null; }

    var b = f.s.bbox;
    var cx = f.s.center.x, cy = f.s.center.y;
    var pad = g.unit * 0.5;

    function free(box) {
      if (box.x < g.vb.x || box.y < g.vb.y ||
          box.x + box.w > g.vb.x + g.vb.w ||
          box.y + box.h > g.vb.y + g.vb.h) { return false; }
      /* Clear of every desk shape — which is stricter than "clear of the desk
         number badge", and stays true whatever state the desk is painted in. */
      for (var i = 0; i < g.deskBoxes.length; i++) {
        if (boxesOverlap(box, g.deskBoxes[i], pad)) { return false; }
      }
      for (var j = 0; j < placed.length; j++) {
        if (boxesOverlap(box, placed[j], pad)) { return false; }
      }
      return true;
    }

    function fitsInside(box) { return box.w <= b.w * 0.94 && box.h <= b.h * 0.9; }

    /* A named room's label belongs inside the room, so it shrinks a little to
       fit rather than wandering off somewhere meaningless. */
    if (f.kind === 'room') {
      for (var k = 0; k < 4; k++) {
        var fs = baseFs * (1 - k * 0.12);
        var box = labelBox(text, cx, cy, fs);
        if (fitsInside(box) && free(box)) { return { x: cx, y: cy, fs: fs, box: box }; }
      }
      return null;
    }

    var lh = baseFs * 1.15;
    var half = labelBox(text, 0, 0, baseFs).w / 2;
    var cands = (f.kind === 'outline')
      /* The outline is the whole room: its name goes just inside the top edge,
         where the plan is emptiest, never across the middle of the desks. */
      ? [[cx, b.y + lh * 0.85], [cx, b.y + b.h + lh * 0.85], [cx, b.y - lh * 0.85]]
      : [[cx, cy],
         [cx, b.y + b.h + lh * 0.8],
         [cx, b.y - lh * 0.8],
         [b.x + b.w + half + g.unit, cy],
         [b.x - half - g.unit, cy]];

    for (var c = 0; c < cands.length; c++) {
      var cand = labelBox(text, cands[c][0], cands[c][1], baseFs);
      if (c === 0) {
        /* The first candidate is the one inside the shape. Only take it if the
           shape is actually big enough to hold the text. */
        if (f.kind === 'outline' ? cand.w > b.w * 0.94 : !fitsInside(cand)) { continue; }
      }
      if (free(cand)) { return { x: cands[c][0], y: cands[c][1], fs: baseFs, box: cand }; }
    }
    return null;
  }

  function buildFeatures(g) {
    var layer = mk('g', { class: 'feature-layer' });
    /* Inline as well as in Style.html: this is the guarantee that a feature can
       never swallow a tap meant for a desk, and it should not depend on a
       stylesheet loading. */
    layer.style.pointerEvents = 'none';
    layer.setAttribute('aria-hidden', 'true');

    featureRecs = [];
    if (!g.features.length) { return layer; }

    var baseFs = featureLabelSize(g);
    var placed = [];

    g.features.forEach(function (f) {
      var node = mk('g', { class: 'feature feature--' + (f.kind || 'unknown') });
      node.setAttribute('data-feature-kind', f.kind || 'unknown');
      drawFeature(node, f);

      var lab = placeFeatureLabel(f, g, baseFs, placed);
      if (lab) {
        var t = mk('text', { class: 'feature__label', x: lab.x, y: lab.y, text: f.label });
        t.style.fontSize = lab.fs + 'px';
        node.appendChild(t);
        placed.push(lab.box);
      }

      layer.appendChild(node);
      featureRecs.push({
        id: f.id, kind: f.kind, label: f.label, note: f.note, s: f.s, node: node
      });
    });

    return layer;
  }

  /* Whether the room on screen right now actually has structure drawn on it.
     Asked of the ACTIVE room, not of the deployment: the main office has an
     empty `features` array on purpose, and a legend entry explaining a grey
     that appears nowhere on the plan in front of you is a puzzle, not a key.
     Reads the converted features, so a feature whose shape rooms.json could
     not express — and which therefore drew nothing — does not count either. */
  function activeRoomHasFeatures() {
    if (geom && String(geom.roomId) === String(activeRoomId)) {
      return geom.features.length > 0;
    }
    var room = roomById(activeRoomId);
    return !!(room && isArr(room.features) && room.features.length);
  }

  /* --- geometric hit testing -------------------------------------------
     Features take no pointer events at all, so hovering one is resolved
     against the geometry instead of the DOM. That keeps the no-interception
     guarantee absolute while still letting a note surface on hover.
     ---------------------------------------------------------------------- */

  function clientToView(cx, cy) {
    var svg = $('map-svg');
    if (!svg || !geom) { return null; }
    try {
      var m = svg.getScreenCTM();
      if (m && svg.createSVGPoint) {
        var p = svg.createSVGPoint();
        p.x = cx; p.y = cy;
        var q = p.matrixTransform(m.inverse());
        return { x: q.x, y: q.y };
      }
    } catch (e) { /* fall through to the box-relative mapping */ }
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) { return null; }
    return {
      x: geom.vb.x + ((cx - r.left) / r.width) * geom.vb.w,
      y: geom.vb.y + ((cy - r.top) / r.height) * geom.vb.h
    };
  }

  function pointInPoly(pts, x, y) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > y) !== (yj > y) &&
          x < ((xj - xi) * (y - yi)) / ((yj - yi) || 1e-9) + xi) {
        inside = !inside;
      }
    }
    return inside;
  }

  function nearPath(pts, x, y, tol) {
    for (var i = 1; i < pts.length; i++) {
      var ax = pts[i - 1][0], ay = pts[i - 1][1];
      var bx = pts[i][0], by = pts[i][1];
      var dx = bx - ax, dy = by - ay;
      var len2 = dx * dx + dy * dy;
      var t = len2 ? clamp(0, ((x - ax) * dx + (y - ay) * dy) / len2, 1) : 0;
      var px = ax + t * dx - x, py = ay + t * dy - y;
      if (Math.sqrt(px * px + py * py) <= tol) { return true; }
    }
    return false;
  }

  function hitShape(s, x, y, tol) {
    if (s.kind === 'polyline') { return nearPath(s.points, x, y, tol); }
    var b = s.bbox;
    if (x < b.x - tol || x > b.x + b.w + tol ||
        y < b.y - tol || y > b.y + b.h + tol) { return false; }
    if (s.kind === 'rect') { return true; }
    return pointInPoly(s.points, x, y) ||
           nearPath(s.points.concat([s.points[0]]), x, y, tol);
  }

  /* Topmost note-bearing feature under the pointer, or null. Features without
     a note say nothing a tooltip could usefully add, so they are not probed. */
  function featureAt(clientX, clientY) {
    if (!featureRecs.length || !geom) { return null; }
    var p = clientToView(clientX, clientY);
    if (!p) { return null; }
    var tol = geom.unit * 1.6;
    for (var i = featureRecs.length - 1; i >= 0; i--) {
      var rec = featureRecs[i];
      if (!rec.note) { continue; }
      if (hitShape(rec.s, p.x, p.y, tol)) { return rec; }
    }
    return null;
  }

  function buildRoom(roomId) {
    var svg = $('map-svg');
    var ratioBox = $('map-ratio');
    if (!svg || !ratioBox) { return; }

    featureRecs = [];
    featureLayer = null;
    tipFeatureId = null;

    var room = roomById(roomId) || roomsList()[0];
    if (!room) {
      svg.setAttribute('viewBox', '0 0 100 100');
      ratioBox.style.paddingBottom = '56%';
      showNote('This deployment has no rooms in its floor plan configuration, so ' +
               'there is nothing to show. Tell the coordinator.');
      return;
    }

    activeRoomId = room.id;
    geom = computeGeom(room);
    deskNodes = {};
    deskOrder = [];

    /* Aspect-locked box, straight from image_size: the plan keeps the shape of
       the room it describes at every width, and no resize maths is needed to
       keep the drawing square with its own coordinate space. */
    ratioBox.style.paddingBottom = (geom.ratio * 100) + '%';

    while (svg.firstChild) { svg.removeChild(svg.firstChild); }
    svg.setAttribute('viewBox',
      geom.vb.x + ' ' + geom.vb.y + ' ' + geom.vb.w + ' ' + geom.vb.h);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('aria-label',
      'Floor plan of ' + (room.label || room.id) + '. ' +
      roomDesks(room).length + ' desks.');

    svg.appendChild(buildDefs(geom));

    /* The sheet the plan is drawn on: graph paper inside a dashed edge, so the
       extent of the drawing is visible even where the room has no structure
       of its own on it. Dashed on purpose — it is the edge of the sheet, not
       a wall. */
    var bg = mk('g', { class: 'map-bglayer' });
    bg.appendChild(mk('rect', {
      x: geom.vb.x, y: geom.vb.y, width: geom.vb.w, height: geom.vb.h,
      style: 'fill: var(--surface)'
    }));
    bg.appendChild(mk('rect', {
      x: geom.vb.x, y: geom.vb.y, width: geom.vb.w, height: geom.vb.h,
      style: 'fill: url(#dm-pat-grid)'
    }));
    bg.appendChild(mk('rect', {
      class: 'map-frame',
      x: geom.vb.x + geom.unit, y: geom.vb.y + geom.unit,
      width: Math.max(1, geom.vb.w - geom.unit * 2),
      height: Math.max(1, geom.vb.h - geom.unit * 2)
    }));
    svg.appendChild(bg);

    /* Structure, beneath the desks. Empty for a room whose config lists no
       features, which is a legitimate and unremarkable state: buildFeatures
       returns an empty layer and nothing below it changes. */
    featureLayer = buildFeatures(geom);
    svg.appendChild(featureLayer);

    /* Desks. */
    var layer = mk('g', { class: 'desk-layer' });
    roomDesks(room).forEach(function (desk) {
      var rec = buildDesk(desk, geom);
      if (rec) {
        layer.appendChild(rec.group);
        deskNodes[desk.id] = rec;
        deskOrder.push(desk.id);
      }
    });
    svg.appendChild(layer);

    /* Notes are per-room, so the previous room's do not follow you here. The
       only thing worth a banner is a desk the config failed to place: that one
       is a real fault, and it costs somebody a desk they cannot rank. */
    clearNotes();
    if (geom.badShapes.length) {
      addNote('These desks have no usable shape in rooms.json and are not drawn: ' +
              geom.badShapes.join(', ') + '. Tell the coordinator — you cannot rank ' +
              'them from the plan.');
    }

    builtFor = room.id;
    view.autoZoomDone = false;
    view.zoom = 1;

    /* Roving tabindex starts on something the user can actually use. */
    focusDeskId = null;
    for (var i = 0; i < deskOrder.length; i++) {
      if (rankOf(deskOrder[i]) || statusOf(deskOrder[i]).ok) {
        focusDeskId = deskOrder[i];
        break;
      }
    }
    if (!focusDeskId && deskOrder.length) { focusDeskId = deskOrder[0]; }

    paintDesks();
  }

  /* The instructions under the plan say what a tap does, so they change with
     the mode. The rank wording is whatever ViewSelect authored; it is captured
     once rather than duplicated here. */
  function paintHint() {
    var n = $('map-hint');
    if (!n) { return; }
    if (defaultHint === null) { defaultHint = n.textContent; }
    n.textContent = isSingle()
      ? (single.hint || 'Tap the desk you are sitting at now. One desk only, and ' +
         'nothing is saved until you confirm below.') +
        ' With a keyboard: tab to the plan, move between desks with the arrow keys, ' +
        'and press Enter or Space to select one.'
      : defaultHint;
  }

  function buildDesk(desk, g) {
    var s = g.shapes[desk.id];
    if (!s) { return null; }

    var group = mk('g', { class: 'deskgroup' });
    group.setAttribute('data-desk-id', desk.id);
    APP.applyZoneVars(group, desk.zone);

    var shape = shapeNode(s);
    shape.setAttribute('class', 'desk');
    shape.setAttribute('data-desk-id', desk.id);
    shape.setAttribute('role', 'button');
    shape.setAttribute('tabindex', '-1');
    group.appendChild(shape);

    /* Immediately after .desk, so Style.html's `.desk.is-picked + .desk__label`
       rule keeps working. */
    var labelText = String(desk.label);
    var fs = Math.min(s.bbox.h * 0.40, (s.bbox.w * 0.86) / Math.max(1, labelText.length));
    fs = Math.max(fs, g.unit * 1.4);
    var label = mk('text', { class: 'desk__label', x: s.center.x, y: s.center.y, text: labelText });
    label.style.fontSize = fs + 'px';
    group.appendChild(label);

    /* The rank medal and the state glyphs each need their own room inside the
       shape, so the number slides out of their way rather than under them. */
    var labelYUp = s.center.y - s.bbox.h * 0.16;
    var labelYDown = s.center.y + s.bbox.h * 0.20;

    var glyphSize = Math.min(s.bbox.w, s.bbox.h) * 0.42;
    var glyphY = s.center.y + s.bbox.h * 0.22;
    var lock = lockGlyph(s.center.x, glyphY, glyphSize);
    var ban = banGlyph(s.center.x, glyphY, glyphSize);
    svgShow(lock, false);
    svgShow(ban, false);
    group.appendChild(lock);
    group.appendChild(ban);

    /* Rank medal, top-left inside the shape. */
    var r = Math.max(Math.min(s.bbox.w, s.bbox.h) * 0.26, g.unit * 2.2);
    var medal = mk('g', { class: 'desk__medalwrap' });
    svgShow(medal, false);
    var mc = mk('circle', {
      class: 'desk__medal', cx: s.bbox.x + r * 1.02, cy: s.bbox.y + r * 1.02, r: r
    });
    var mt = mk('text', {
      class: 'desk__rank', x: s.bbox.x + r * 1.02, y: s.bbox.y + r * 1.02, text: ''
    });
    mt.style.fontSize = (r * 1.28) + 'px';
    medal.appendChild(mc);
    medal.appendChild(mt);
    group.appendChild(medal);

    return {
      id: desk.id, desk: desk, shape: shape, group: group, label: label,
      lock: lock, ban: ban, medal: medal, medalText: mt,
      center: s.center, bbox: s.bbox,
      labelY: s.center.y, labelYUp: labelYUp, labelYDown: labelYDown,
      fs: fs, fsSmall: fs * 0.82
    };
  }

  /* ----------------------------------------------------------------------
     Desk state painting
     ---------------------------------------------------------------------- */

  function deskAria(rec, status, rank) {
    var bits = [APP.deskTitle(rec.id)];
    var sub = APP.deskSubtitle(rec.id);
    if (sub) { bits.push(sub); }
    if (isSingle()) {
      if (rank) { bits.push('the desk you are keeping'); }
      else if (!status.ok) { bits.push(status.reason); }
      else { bits.push('select to keep this desk'); }
    } else if (rank) { bits.push('your ' + ordinal(rank) + ' choice'); }
    else if (!status.ok) { bits.push(status.reason); }
    else { bits.push('available'); }
    if (rec.desk.notes) { bits.push(rec.desk.notes); }
    return bits.join('. ');
  }

  /* In single mode "rank" collapses to 0 or 1: the one desk being kept. The
     medal then carries a tick instead of a number, and nothing else changes. */
  function rankOf(id) {
    if (isSingle()) { return single.id === id ? 1 : 0; }
    return APP.rankOf(id);
  }

  function paintDesks() {
    var k = APP.K;
    deskOrder.forEach(function (id) {
      var rec = deskNodes[id];
      if (!rec) { return; }
      var status = statusOf(id);
      var rank = rankOf(id);
      var picked = rank > 0;
      var cl = rec.shape.classList;
      var gcl = rec.group.classList;

      cl.remove('is-picked', 'is-locked', 'is-ineligible');
      gcl.remove('is-muted');
      svgShow(rec.lock, false);
      svgShow(rec.ban, false);

      var showGlyph = false;
      if (picked) {
        cl.add('is-picked');
      } else if (status.code === 'locked' || status.code === 'unavailable') {
        cl.add('is-locked');
        svgShow(rec.lock, true);
        gcl.add('is-muted');
        showGlyph = true;
      } else if (!status.ok) {
        cl.add('is-ineligible');
        svgShow(rec.ban, true);
        gcl.add('is-muted');
        showGlyph = true;
      }

      rec.label.setAttribute('y',
        picked ? rec.labelYDown : (showGlyph ? rec.labelYUp : rec.labelY));
      rec.label.style.fontSize = (picked ? rec.fsSmall : rec.fs) + 'px';
      rec.label.classList.toggle('on-fill', picked);

      svgShow(rec.medal, picked);
      rec.medalText.textContent = picked ? (isSingle() ? '✓' : String(rank)) : '';

      rec.shape.setAttribute('aria-pressed', picked ? 'true' : 'false');
      if (status.ok) { rec.shape.removeAttribute('aria-disabled'); }
      else { rec.shape.setAttribute('aria-disabled', 'true'); }
      rec.shape.setAttribute('aria-label', deskAria(rec, status, rank));
      rec.shape.setAttribute('tabindex', id === focusDeskId ? '0' : '-1');
      rec.shape.setAttribute('data-state',
        picked ? 'picked' : (status.ok ? 'available' : status.code));
      /* Kept for parity with the ranked list; K is only ever read, never assumed. */
      if (!isSingle() && picked && k && rank > k) { cl.add('is-ineligible'); }
    });
  }

  /* ----------------------------------------------------------------------
     Legend — one entry per zone from config, plus one per desk state
     ---------------------------------------------------------------------- */

  function sampleSvg(kind) {
    var fill, stroke, dash = '', extra = '';
    if (kind === 'available') { fill = 'rgba(var(--zone-rgb), var(--zone-alpha-fill))'; stroke = 'var(--zone, var(--ink-3))'; }
    else if (kind === 'picked') { fill = 'var(--ink)'; stroke = 'var(--ink)'; extra = '<text x="12" y="9" text-anchor="middle" dominant-baseline="central" style="font-size:9px;font-weight:800;fill:var(--surface)">1</text>'; }
    else if (kind === 'locked') { fill = 'var(--sunken)'; stroke = 'var(--ink-3)'; extra = '<path d="M8.5 9.5 V7.8 a1.9 1.9 0 0 1 3.8 0 V9.5" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/><rect x="7.6" y="9.4" width="5.6" height="3.6" rx="0.8" fill="var(--ink-3)"/><path d="M15 3 L21 3 M15 6 L21 6 M15 9 L21 9 M15 12 L21 12" stroke="var(--line-2)" stroke-width="2"/>'; }
    else { fill = 'var(--surface-2)'; stroke = 'var(--line-2)'; dash = ' stroke-dasharray="3 2"'; extra = '<circle cx="10.5" cy="8" r="4" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/><path d="M7.7 10.8 L13.3 5.2" stroke="var(--ink-3)" stroke-width="1.2"/><circle cx="18" cy="4" r="1" fill="var(--line-2)"/><circle cx="21" cy="8" r="1" fill="var(--line-2)"/><circle cx="18" cy="12" r="1" fill="var(--line-2)"/>'; }
    return '<svg class="map-legend__sample" viewBox="0 0 24 16" aria-hidden="true">' +
           '<rect x="0.8" y="0.8" width="22.4" height="14.4" rx="2" fill="' + fill +
           '" stroke="' + stroke + '" stroke-width="1.4"' + dash + '/>' + extra + '</svg>';
  }

  /* One sample standing in for all of the structure: an enclosing wall, a soft
     block of furniture and a pane of glazing. */
  function featureSampleSvg() {
    return '<svg class="map-legend__sample" viewBox="0 0 24 16" aria-hidden="true">' +
      '<rect x="1" y="1.6" width="22" height="12.8" fill="none" stroke="var(--ink-3)" ' +
        'stroke-opacity="0.75" stroke-width="1.6"/>' +
      '<rect x="3.4" y="4.4" width="7.2" height="7" fill="var(--ink-3)" fill-opacity="0.16" ' +
        'stroke="var(--ink-3)" stroke-opacity="0.45" stroke-width="0.8"/>' +
      '<path d="M14.5 3.2 h6.5 M14.5 5.2 h6.5" stroke="var(--ink-3)" stroke-opacity="0.85" ' +
        'stroke-width="0.9"/>' +
      '<path d="M14.5 12 a4.5 4.5 0 0 0 4.5 -4.5" fill="none" stroke="var(--ink-3)" ' +
        'stroke-opacity="0.5" stroke-width="0.9"/>' +
      '</svg>';
  }

  function renderLegend() {
    var host = $('map-legend');
    if (!host) { return; }

    var zones = APP.zones();
    var ids = APP.zoneIds();
    var person = APP.state.person;
    /* Zones do not gate anything in single mode (see claimStatus), so the
       "not open to you" annotation would be a lie there. */
    var allowed = (!isSingle() && person && isArr(person.allowedZones))
      ? person.allowedZones : null;

    var html = '<div class="map-legend__group"><p class="map-legend__title">Areas</p>';
    if (!ids.length) {
      html += '<span class="map-legend__note">No zones are defined in the floor plan configuration.</span>';
    }
    ids.forEach(function (zid) {
      var z = zones[zid] || {};
      var open = !allowed || allowed.indexOf(zid) >= 0;
      html += '<span class="map-legend__item" data-legend-zone="' + esc(zid) + '"' +
              (z.description ? ' title="' + esc(z.description) + '"' : '') + '>' +
              '<span class="swatch" aria-hidden="true"></span>' +
              '<span>' + esc(z.label || zid) +
              (open ? '' : ' <span class="map-legend__note">(not open to you)</span>') +
              '</span></span>';
    });
    html += '</div>';

    html += '<div class="map-legend__group"><p class="map-legend__title">Desk states</p>';
    if (isSingle()) {
      /* No ranks and no zone gate on this step, so neither state is listed —
         a legend of things that cannot happen is worse than a short legend. */
      html += '<span class="map-legend__item">' + sampleSvg('available') +
                '<span>Free &mdash; tap the one you sit at now</span></span>' +
              '<span class="map-legend__item">' + sampleSvg('picked') +
                '<span>The desk you are keeping</span></span>' +
              '<span class="map-legend__item">' + sampleSvg('locked') +
                '<span>Taken &mdash; someone else is staying here (hatched, padlock)</span></span>';
    } else {
      html += '<span class="map-legend__item">' + sampleSvg('available') + '<span>Available &mdash; tap to rank</span></span>' +
        '<span class="map-legend__item">' + sampleSvg('picked') + '<span>Ranked by you &mdash; the number is its rank</span></span>' +
        '<span class="map-legend__item">' + sampleSvg('locked') + '<span>Kept &mdash; someone is staying at this desk (hatched, padlock)</span></span>' +
        '<span class="map-legend__item">' + sampleSvg('ineligible') + '<span>Not open to you &mdash; wrong area for you (dotted, crossed)</span></span>';
    }
    html += '</div>';

    /* One muted line for all of the structure, deliberately outside the desk
       states: none of it is a state a desk can be in, and none of it can be
       picked. Listing every kind would be a legend of things you cannot do. */
    if (activeRoomHasFeatures()) {
      html += '<div class="map-legend__group"><p class="map-legend__title">The room itself</p>' +
        '<span class="map-legend__item map-legend__item--muted">' + featureSampleSvg() +
        '<span class="map-legend__note">Grey &mdash; walls, doors, windows and fixed ' +
        'furniture. Not selectable.</span></span></div>';
    }

    host.innerHTML = html;

    /* Zone colours come from JsCore, never from this file. */
    toArray(host.querySelectorAll('[data-legend-zone]')).forEach(function (node) {
      APP.applyZoneVars(node, node.getAttribute('data-legend-zone'));
    });
  }

  /* ----------------------------------------------------------------------
     Room tabs
     ---------------------------------------------------------------------- */

  function openDeskCount(room) {
    var n = 0;
    roomDesks(room).forEach(function (d) { if (statusOf(d.id).ok) { n++; } });
    return n;
  }

  function renderRoomTabs() {
    var host = $('map-rooms');
    var nameEl = $('map-roomname');
    if (!host) { return; }
    var rooms = roomsList();

    if (rooms.length <= 1) {
      host.hidden = true;
      host.innerHTML = '';
      if (nameEl) {
        nameEl.textContent = rooms.length ? (rooms[0].label || rooms[0].id) : '';
      }
      return;
    }

    if (nameEl) { nameEl.textContent = ''; }
    host.hidden = false;
    var html = '';
    rooms.forEach(function (room) {
      var sel = String(room.id) === String(activeRoomId);
      var count;
      if (isSingle()) {
        var here = single.id && APP.deskById(single.id) &&
                   String(APP.deskById(single.id).roomId) === String(room.id);
        count = here ? 'your desk' : (openDeskCount(room) + ' free');
      } else {
        var mine = 0;
        APP.state.picks.forEach(function (id) {
          var d = APP.deskById(id);
          if (d && String(d.roomId) === String(room.id)) { mine++; }
        });
        count = mine ? (mine + ' ranked') : (openDeskCount(room) + ' open');
      }
      html += '<button type="button" class="map-rooms__tab" role="tab" ' +
              'data-room-id="' + esc(room.id) + '" ' +
              'aria-selected="' + (sel ? 'true' : 'false') + '" ' +
              'tabindex="' + (sel ? '0' : '-1') + '">' +
              '<span>' + esc(room.label || room.id) + '</span>' +
              '<span class="map-rooms__count">' + esc(count) + '</span></button>';
    });
    host.innerHTML = html;
  }

  function switchRoom(roomId) {
    if (String(roomId) === String(activeRoomId) && builtFor === activeRoomId) { return; }
    hideTip();
    buildRoom(roomId);
    renderRoomTabs();
    /* The structure entry describes the room you are looking at, so it has to
       be redrawn with it: one of these rooms has features and one does not. */
    renderLegend();
    measure(true);
  }

  function pickInitialRoom() {
    var rooms = roomsList();
    if (!rooms.length) { return null; }

    /* On the pre-lock step the desk they are keeping is the point of the
       screen, so open the room it is in whatever was showing before. */
    if (isSingle() && single.id) {
      var kept = APP.deskById(single.id);
      if (kept) { return kept.roomId; }
    }
    if (activeRoomId && roomById(activeRoomId)) { return activeRoomId; }

    var picks = APP.state.picks;
    for (var i = 0; i < picks.length; i++) {
      var d = APP.deskById(picks[i]);
      if (d) { return d.roomId; }
    }
    for (var r = 0; r < rooms.length; r++) {
      if (openDeskCount(rooms[r]) > 0) { return rooms[r].id; }
    }
    return rooms[0].id;
  }

  /* ----------------------------------------------------------------------
     Notes
     ---------------------------------------------------------------------- */

  var noteMsgs = [];

  function paintNotes() {
    var n = $('map-note');
    if (!n) { return; }
    if (!noteMsgs.length) { n.hidden = true; n.innerHTML = ''; return; }
    n.hidden = false;
    n.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" aria-hidden="true" style="flex:0 0 auto;width:1.1rem;height:1.1rem;' +
      'margin-top:.15rem"><path d="M10 2.5 18.5 17.5H1.5z"></path>' +
      '<path d="M10 8v4M10 15h.01"></path></svg><span>' +
      noteMsgs.map(esc).join('<br>') + '</span>';
  }

  function addNote(text) {
    if (noteMsgs.indexOf(text) < 0) { noteMsgs.push(text); }
    paintNotes();
  }

  function clearNotes() { noteMsgs = []; paintNotes(); }
  function showNote(text) { clearNotes(); addNote(text); }

  /* ----------------------------------------------------------------------
     Zoom and pan
     ---------------------------------------------------------------------- */

  function applyWidth() {
    var inner = $('map-stage-inner');
    if (!inner || !view.fitW) { return; }
    var w = Math.max(1, Math.round(view.fitW * view.zoom));
    inner.style.width = w + 'px';
    fitStageHeight(w);
  }

  /* A long narrow room fitted to the width of a phone is a thin ribbon adrift
     in a tall grey box: the main office is roughly 4:1, so at 375px the plan
     is 81px of drawing inside 406px of stage. So the viewport takes the height
     the plan actually needs, and keeps the stylesheet's height only when the
     plan is at least that tall — which is every room shaped like a room, and
     this one too as soon as it is zoomed.

     The stylesheet's height is re-read in measure() with this override
     cleared, so the number below is never computed from a height this function
     itself set: no feedback, and the ResizeObserver settles after one pass. */
  function fitStageHeight(innerW) {
    var stage = $('map-stage');
    if (!stage || !geom || !view.maxH) { return; }
    /* An overlay scrollbar measures 0; a classic one has to be paid for, or a
       plan sized exactly to the stage would gain a vertical scrollbar too. */
    var bar = Math.max(0, stage.offsetHeight - stage.clientHeight);
    var want = Math.ceil(innerW * geom.ratio + bar);
    if (want >= view.maxH) { stage.style.height = ''; return; }
    stage.style.height = Math.max(MIN_STAGE_PX, want) + 'px';
  }

  function updateZoomUi() {
    var lvl = $('map-zoom-level');
    if (lvl) { lvl.textContent = Math.round(view.zoom * 100) + '%'; }
    var out = $('map-zoom-out'), inn = $('map-zoom-in'), fit = $('map-zoom-fit');
    if (out) { out.disabled = view.zoom <= 1.001; }
    if (inn) { inn.disabled = view.zoom >= MAX_ZOOM - 0.001; }
    if (fit) { fit.disabled = view.zoom <= 1.001; }
  }

  /* The smallest desk number in this room, in screen pixels at the given
     scale. Read off the sizes the renderer actually gave the labels rather
     than recomputed from the config, so the two cannot disagree. */
  function smallestLabelPx(pxPerUnit) {
    var min = Infinity;
    for (var i = 0; i < deskOrder.length; i++) {
      var rec = deskNodes[deskOrder[i]];
      if (rec && rec.fs > 0 && rec.fs < min) { min = rec.fs; }
    }
    return isFinite(min) ? min * pxPerUnit : 0;
  }

  /* The zoom the plan opens at.

     Zoom 1 means "the whole room fits across the stage", which is the right
     opening move for a room shaped roughly like the screen and the wrong one
     for a 4:1 corridor: fitted to a 375px phone, the main office comes out
     with 16px desks and six-pixel desk numbers, so the map is an illustration
     of a room rather than a thing you can use. A plan whose numbers cannot be
     read is not a plan, whatever is pointing at it, so legibility is checked
     for every pointer; the finger-sized target on top of it is only asked for
     when there is a finger. Both bounds come from the geometry that was
     actually drawn — no room shape, desk count or aspect is assumed. */
  function autoZoom() {
    if (!geom || !view.fitW) { return 1; }
    var pxPerUnit = view.fitW / geom.vb.w;
    if (!(pxPerUnit > 0)) { return 1; }

    var need = 1;
    var label = smallestLabelPx(pxPerUnit);
    if (label > 0) { need = Math.max(need, MIN_LABEL_PX / label); }
    if (coarsePointer()) {
      var tap = geom.minMinor * pxPerUnit;
      if (tap > 0) { need = Math.max(need, MIN_TAP_PX / tap); }
    }
    /* Seeing the whole room at once is worth something too, and it is what
       zoom 1 buys. A few percent of zoom trades all of that for a fraction of
       a pixel of type, so it is not taken: only a shortfall big enough to
       matter is worth opening the plan cropped for. */
    return need < ZOOM_DEADBAND ? 1 : clamp(1, need, MAX_ZOOM);
  }

  function measure(resetZoom) {
    var stage = $('map-stage');
    if (!stage || !geom) { return; }
    /* Back to the stylesheet's own height before measuring: everything below
       has to be derived from the height the CSS asks for, never from the one
       fitStageHeight last wrote, or the two would chase each other. */
    stage.style.height = '';
    var cw = stage.clientWidth;
    var ch = stage.clientHeight;
    if (!cw) { return; }                     /* view still hidden */
    var fitW = Math.min(cw, geom.ratio > 0 ? ch / geom.ratio : cw);
    if (!(fitW > 0)) { fitW = cw; }
    view.fitW = fitW;
    view.maxH = ch;
    if (resetZoom) { view.zoom = 1; view.autoZoomDone = false; }
    applyWidth();
    if (!view.autoZoomDone) {
      view.autoZoomDone = true;
      var z = autoZoom();
      if (z > 1.001) {
        setZoom(z);
        /* Opening zoomed in means most of a long room is off to one side, and
           the middle of a corridor is nobody's answer to "where do I start?".
           Open on the desk this person can actually act on — the same one the
           keyboard starts at, and the one they are keeping on the pre-lock
           step. */
        var start = openOnDesk();
        if (start) { centerOnDesk(start, false); }
        return;
      }
    }
    updateZoomUi();
  }

  /* The desk the plan should be looking at when it opens. */
  function openOnDesk() {
    if (isSingle() && single.id && deskNodes[single.id]) { return single.id; }
    return focusDeskId;
  }

  function setZoom(z, ax, ay) {
    var stage = $('map-stage');
    var inner = $('map-stage-inner');
    if (!stage || !inner) { return; }
    z = clamp(1, z, MAX_ZOOM);
    if (Math.abs(z - view.zoom) < 0.0005) { return; }

    var sr = stage.getBoundingClientRect();
    if (ax == null) { ax = sr.left + sr.width / 2; }
    if (ay == null) { ay = sr.top + sr.height / 2; }

    var r = inner.getBoundingClientRect();
    var fx = r.width ? clamp(0, (ax - r.left) / r.width, 1) : 0.5;
    var fy = r.height ? clamp(0, (ay - r.top) / r.height, 1) : 0.5;

    view.zoom = z;
    applyWidth();

    var r2 = inner.getBoundingClientRect();
    stage.scrollLeft += (r2.left + fx * r2.width) - ax;
    stage.scrollTop += (r2.top + fy * r2.height) - ay;
    updateZoomUi();
  }

  function centerOnDesk(id, flash) {
    var rec = deskNodes[id];
    var stage = $('map-stage');
    var inner = $('map-stage-inner');
    if (!rec || !stage || !inner || !geom) { return; }
    var r = inner.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    if (!r.width) { return; }
    var fx = (rec.center.x - geom.vb.x) / geom.vb.w;
    var fy = (rec.center.y - geom.vb.y) / geom.vb.h;
    stage.scrollLeft += (r.left + fx * r.width) - (sr.left + sr.width / 2);
    stage.scrollTop += (r.top + fy * r.height) - (sr.top + sr.height / 2);
    if (flash) {
      rec.group.classList.remove('is-flash');
      /* reflow so the animation restarts */
      void rec.group.getBoundingClientRect();
      rec.group.classList.add('is-flash');
      global.setTimeout(function () { rec.group.classList.remove('is-flash'); }, 2000);
    }
  }

  /* ----------------------------------------------------------------------
     Tooltip (SVG shapes cannot use the CSS ::after tooltip in Style.html)
     ---------------------------------------------------------------------- */

  function ensureTip() {
    if (tipEl && tipEl.parentNode) { return tipEl; }
    tipEl = doc.createElement('div');
    tipEl.className = 'tip tip--float';
    tipEl.setAttribute('role', 'presentation');
    doc.body.appendChild(tipEl);
    return tipEl;
  }

  /* Anchors the tip above `r` (a client rect), flipping below when there is no
     room, and never letting it leave the viewport. */
  function placeTip(el, r) {
    var t = el.getBoundingClientRect();
    var vw = doc.documentElement.clientWidth;
    var vh = doc.documentElement.clientHeight;
    var left = clamp(8, r.left + r.width / 2 - t.width / 2, Math.max(8, vw - t.width - 8));
    var top = r.top - t.height - 8;
    if (top < 8) { top = Math.min(r.bottom + 8, vh - t.height - 8); }
    el.style.left = left + 'px';
    el.style.top = Math.max(8, top) + 'px';
  }

  function showTipFor(id) {
    var rec = deskNodes[id];
    if (!rec) { return; }
    var status = statusOf(id);
    var rank = rankOf(id);
    var el = ensureTip();

    var html = '<span class="tip__title">' + esc(APP.deskTitle(id)) + '</span>';
    var sub = APP.deskSubtitle(id);
    if (sub) { html += '<span class="tip__row">' + esc(sub) + '</span>'; }
    if (rec.desk.notes) { html += '<span class="tip__row">' + esc(rec.desk.notes) + '</span>'; }
    if (isSingle()) {
      if (!status.ok) {
        html += '<span class="tip__reason">' + esc(status.reason) + '</span>';
      } else if (rank) {
        html += '<span class="tip__reason">Selected. Tap again to deselect.</span>';
      } else if (outsideMyZones(id)) {
        /* Not a refusal — see claimStatus. Just a thing worth knowing. */
        html += '<span class="tip__reason">This is not an area you could be assigned ' +
                'to in the ranking. You can still keep it if it is where you sit.</span>';
      }
    } else if (rank) {
      html += '<span class="tip__reason">Your ' + ordinal(rank) +
              ' choice. Tap again to remove it.</span>';
    } else if (!status.ok) {
      html += '<span class="tip__reason">' + esc(status.reason) + '</span>';
    }
    el.innerHTML = html;
    el.classList.add('is-open');
    placeTip(el, rec.shape.getBoundingClientRect());
    tipFor = id;
    tipFeatureId = null;
  }

  /* Same tooltip, for a piece of structure. Reached only through the geometric
     hit test, because the features themselves take no pointer events. */
  function showFeatureTip(rec) {
    if (tipFeatureId === rec.id) { return; }
    var el = ensureTip();
    var title = rec.label ||
      (rec.kind ? rec.kind.charAt(0).toUpperCase() + rec.kind.slice(1) : 'Floor plan');
    var html = '<span class="tip__title">' + esc(title) + '</span>';
    if (rec.note) { html += '<span class="tip__row">' + esc(rec.note) + '</span>'; }
    html += '<span class="tip__reason">Part of the room, not a desk.</span>';
    el.innerHTML = html;
    el.classList.add('is-open');
    placeTip(el, rec.node.getBoundingClientRect());
    tipFor = null;
    tipFeatureId = rec.id;
  }

  function hideTip() {
    if (tipEl) { tipEl.classList.remove('is-open'); }
    tipFor = null;
    tipFeatureId = null;
  }

  /* ----------------------------------------------------------------------
     Cross-highlighting between map and list
     ---------------------------------------------------------------------- */

  function setLinked(id) {
    if (linkedId === id) { return; }
    linkedId = id;
    deskOrder.forEach(function (did) {
      var rec = deskNodes[did];
      if (rec) { rec.group.classList.toggle('is-linked', did === id); }
    });
    var list = $('picks-list');
    if (list) {
      toArray(list.querySelectorAll('.pick[data-desk-id]')).forEach(function (row) {
        row.classList.toggle('is-linked', row.getAttribute('data-desk-id') === id);
      });
    }
  }

  /* ----------------------------------------------------------------------
     Desk activation
     ---------------------------------------------------------------------- */

  function activateDesk(id) {
    var status = statusOf(id);
    if (!status.ok) {
      /* Do not spam a banner for something the map already shows as blocked;
         say why, right where they tapped. */
      showTipFor(id);
      live(APP.deskTitle(id) + (isSingle() ? ' cannot be kept. ' : ' cannot be ranked. ') +
           status.reason);
      return;
    }

    /* Single mode: one desk, selected or not. Nothing is written to the server
       here — the pre-lock view owns that, behind its own explicit confirm.

       The host gets the veto: returning false from onPick leaves the selection
       exactly as it was and suppresses the announcement, so a host that has
       already committed a claim can refuse a change without the map having
       first told a screen reader the opposite. */
    if (isSingle()) {
      var next = (single.id === id) ? null : id;
      if (single.onPick && single.onPick(next, id) === false) { return; }
      single.id = next;
      paintDesks();
      renderRoomTabs();
      live(next
        ? (APP.deskTitle(id) + ' selected. Confirm below to keep it.')
        : (APP.deskTitle(id) + ' deselected.'));
      return;
    }

    if (APP.isPicked(id)) {
      var was = APP.rankOf(id);
      APP.removePick(id);
      live(APP.deskTitle(id) + ' removed from rank ' + was + '.');
    } else {
      if (APP.addPick(id)) {
        live(APP.deskTitle(id) + ' added as your ' + ordinal(APP.rankOf(id)) + ' choice.');
      }
    }
  }

  function setFocusDesk(id, doFocus) {
    if (!deskNodes[id]) { return; }
    focusDeskId = id;
    deskOrder.forEach(function (did) {
      var rec = deskNodes[did];
      if (rec) { rec.shape.setAttribute('tabindex', did === id ? '0' : '-1'); }
    });
    if (doFocus) {
      try { deskNodes[id].shape.focus({ preventScroll: true }); }
      catch (e) { try { deskNodes[id].shape.focus(); } catch (e2) { /* ignore */ } }
      centerOnDesk(id, false);
      showTipFor(id);
      setLinked(id);
    }
  }

  function moveFocusDirection(dx, dy) {
    var cur = deskNodes[focusDeskId];
    if (!cur) {
      if (deskOrder.length) { setFocusDesk(deskOrder[0], true); }
      return;
    }
    var best = null, bestScore = Infinity;
    deskOrder.forEach(function (id) {
      if (id === focusDeskId) { return; }
      var rec = deskNodes[id];
      var vx = rec.center.x - cur.center.x;
      var vy = rec.center.y - cur.center.y;
      var along = vx * dx + vy * dy;
      if (along <= 0) { return; }
      var perp = Math.abs(vx * dy - vy * dx);
      var score = along + perp * 2.5;
      if (score < bestScore) { bestScore = score; best = id; }
    });
    if (best) { setFocusDesk(best, true); }
  }

  /* ----------------------------------------------------------------------
     Ranked list
     ---------------------------------------------------------------------- */

  function concentrationStats() {
    var conc = APP.concentration();
    var maxCount = 0;
    var keys = Object.keys(conc);
    keys.forEach(function (k) {
      var v = Number(conc[k]) || 0;
      if (v > maxCount) { maxCount = v; }
    });
    /* A single submission makes every desk look "most requested"; require
       enough signal before saying anything at all. */
    var threshold = Math.max(2, maxCount * 0.5);
    return { maxCount: maxCount, threshold: threshold, usable: maxCount >= 2 };
  }

  function isHotDesk(id, stats) {
    stats = stats || concentrationStats();
    if (!stats.usable) { return false; }
    return APP.concentrationFor(id) >= stats.threshold;
  }

  function pickRow(id, index, total, stats) {
    var title = APP.deskTitle(id);
    var sub = APP.deskSubtitle(id);
    var status = APP.deskStatus(id);
    var hot = isHotDesk(id, stats);
    var first = index === 0;
    var last = index === total - 1;

    var flags = '';
    if (hot) {
      flags += '<span class="badge badge--warn" title="Several people who have already ' +
               'submitted put this desk first. It does not change how your ranking is ' +
               'treated.">In demand</span>';
    }
    if (!status.ok) {
      flags += '<span class="badge badge--hot" title="' + esc(status.reason) +
               '">Unavailable</span>';
    }
    if (flags) { flags = '<span class="pick__flags">' + flags + '</span>'; }

    return '<li class="pick" data-desk-id="' + esc(id) + '" data-rank="' + (index + 1) + '">' +
      '<button type="button" class="iconbtn pick__handle" data-act="grab" ' +
        'aria-label="Reorder ' + esc(title) + ', currently your ' + ordinal(index + 1) +
        ' choice. Drag, or press the up and down arrow keys.">' + IC.grip + '</button>' +
      '<span class="pick__rank" aria-hidden="true">' + (index + 1) + '</span>' +
      '<span class="pick__body">' +
        '<span class="pick__title"><span class="sr-only">Choice ' + (index + 1) + ': </span>' +
          esc(title) + ' <span class="deskid">' + esc(id) + '</span></span>' +
        '<span class="pick__meta">' + esc(sub) + '</span>' + flags +
      '</span>' +
      '<span class="pick__actions">' +
        '<button type="button" class="iconbtn" data-act="up"' + (first ? ' disabled' : '') +
          ' aria-label="Move ' + esc(title) + ' up to your ' + ordinal(index) +
          ' choice">' + IC.up + '</button>' +
        '<button type="button" class="iconbtn" data-act="down"' + (last ? ' disabled' : '') +
          ' aria-label="Move ' + esc(title) + ' down to your ' + ordinal(index + 2) +
          ' choice">' + IC.down + '</button>' +
        '<button type="button" class="iconbtn" data-act="remove"' +
          ' aria-label="Remove ' + esc(title) + ' from your ranking">' + IC.x + '</button>' +
      '</span>' +
    '</li>';
  }

  function emptyRow(index) {
    return '<li class="pick pick--empty" data-rank="' + (index + 1) + '">' +
      '<span class="pick__rank" aria-hidden="true">' + (index + 1) + '</span>' +
      '<span class="pick__body">' +
        '<span class="pick__title">Your ' + ordinal(index + 1) + ' choice</span>' +
        '<span class="pick__meta">Not chosen yet &mdash; tap a desk on the plan</span>' +
      '</span></li>';
  }

  function renderPicks() {
    var list = $('picks-list');
    if (!list) { return; }
    var picks = APP.state.picks;
    var k = APP.K;
    var rows = Math.max(k, picks.length);
    var stats = concentrationStats();
    var html = '';

    for (var i = 0; i < rows; i++) {
      if (i < picks.length) { html += pickRow(picks[i], i, picks.length, stats); }
      else { html += emptyRow(i); }
    }
    if (!rows) {
      html = '<li class="pick pick--empty"><span class="pick__body">' +
             '<span class="pick__title">The server has not said how many desks to rank.' +
             '</span></span></li>';
    }
    list.innerHTML = html;

    toArray(list.querySelectorAll('.pick[data-desk-id]')).forEach(function (row) {
      var d = APP.deskById(row.getAttribute('data-desk-id'));
      if (d) { APP.applyZoneVars(row, d.zone); }
    });

    var count = $('picks-count');
    var of = $('picks-of');
    var required = APP.requiredPicks();
    if (count) { count.textContent = String(picks.length); }
    if (of) { of.textContent = 'of ' + (required || k || '—'); }

    var clear = $('picks-clear');
    if (clear) { clear.disabled = picks.length === 0; }

    if (pendingFocus) {
      var target = list.querySelector(pendingFocus);
      if (target) { try { target.focus(); } catch (e) { /* ignore */ } }
      pendingFocus = null;
    }
    if (linkedId) {
      var row2 = list.querySelector('.pick[data-desk-id="' + cssEscape(linkedId) + '"]');
      if (row2) { row2.classList.add('is-linked'); }
    }
  }

  function cssEscape(v) { return String(v).replace(/["\\]/g, '\\$&'); }

  /* ----------------------------------------------------------------------
     Validation strip
     ---------------------------------------------------------------------- */

  function renderValidation() {
    var v = APP.validate();
    var picks = APP.state.picks;
    var required = v.required;
    var strip = $('select-validation');
    var msgEl = $('select-validation-msg');
    var meter = $('select-meter');
    var cont = $('select-continue');

    if (meter) {
      var pct = required > 0 ? clamp(0, (picks.length / required) * 100, 100) : 0;
      meter.style.width = pct + '%';
      meter.classList.toggle('is-complete', v.ok);
    }

    if (strip && msgEl) {
      strip.classList.remove('is-ok', 'is-warn', 'is-error');
      var msg;
      if (v.ok) {
        strip.classList.add('is-ok');
        msg = 'All ' + required + ' choices ranked, in order. Ready to review.';
      } else {
        var onlyIncomplete = true;
        for (var i = 0; i < v.errors.length; i++) {
          if (v.errors[i].code !== 'incomplete') { onlyIncomplete = false; break; }
        }
        strip.classList.add(onlyIncomplete ? 'is-warn' : 'is-error');
        msg = v.errors.length ? v.errors[0].message : v.summary;
        if (v.errors.length > 1) { msg += ' (+' + (v.errors.length - 1) + ' more)'; }
      }
      msgEl.textContent = msg;
    }

    if (cont) {
      cont.disabled = !v.ok;
      cont.setAttribute('title', v.ok ? 'Check your ranking, then submit'
                                      : (v.errors.length ? v.errors[0].message : ''));
    }

    var stripEl = $('rankstrip');
    if (stripEl) {
      var slots = required > 0 ? required : APP.K;
      var html = '';
      for (var s = 0; s < slots; s++) {
        var filled = s < picks.length;
        html += '<span class="rankstrip__slot ' + (filled ? 'is-filled' : 'is-empty') + '">' +
                (s + 1) + '</span>';
      }
      stripEl.innerHTML = html;
    }
  }

  /* ----------------------------------------------------------------------
     Concentration warning — advisory, never blocking, never a nudge to
     misreport. See the copy: it says plainly that honest ranking is still the
     right strategy, because telling people what is popular is exactly the sort
     of information that distorts reporting.
     ---------------------------------------------------------------------- */

  function renderConcentration() {
    var slot = $('conc-slot');
    if (!slot) { return; }
    var picks = APP.state.picks;
    var stats = concentrationStats();

    if (!picks.length || !stats.usable) { slot.innerHTML = ''; return; }

    var hot = [];
    picks.forEach(function (id) { if (isHotDesk(id, stats)) { hot.push(id); } });

    var share = hot.length / picks.length;
    if (hot.length < 2 || share < HOT_SHARE) { slot.innerHTML = ''; return; }

    var names = hot.map(function (id) { return APP.deskTitle(id); });

    slot.innerHTML =
      '<div class="note note--warn conc" role="note">' +
        '<span class="conc__title">Several of your choices are also popular with others</span>' +
        '<p>' + hot.length + ' of the ' + picks.length + ' desks you have ranked (' +
          esc(U.joinList(names)) + ') are top choices for a number of people who have ' +
          'already submitted. That is a snapshot of the submissions received so far and ' +
          'it will keep changing until the form closes.</p>' +
        '<p><strong>This does not change how your ranking is treated, and it is not a ' +
        'suggestion to reorder anything.</strong> Ranking the desks in your genuine order ' +
        'of preference is still your best strategy: the algorithm cannot reward you for ' +
        'putting a desk you like less above one you like more.</p>' +
        '<p>What it does mean is practical: your lower-ranked choices are more likely to ' +
        'be the ones that decide where you sit, and there is a somewhat higher chance that ' +
        'a second round will be needed for the people this affects.</p>' +
      '</div>';
  }

  /* ----------------------------------------------------------------------
     Header text that depends on K and on who the person is
     ---------------------------------------------------------------------- */

  function renderHeader() {
    var lede = $('select-lede');
    var k = APP.K;
    var required = APP.requiredPicks();
    if (lede) {
      if (!k) {
        lede.textContent = 'The server did not say how many desks to rank, so this ' +
                           'page is read-only.';
      } else {
        lede.textContent = 'Rank ' + required + ' desk' + (required === 1 ? '' : 's') +
          ', best first. Order is all that matters — the algorithm is published and seeded, ' +
          'and submitting early does not help you.';
      }
    }

    var elig = $('select-eligibility');
    if (elig) {
      var person = APP.state.person;
      var zones = APP.zones();
      var allowed = (person && isArr(person.allowedZones)) ? person.allowedZones : [];
      var all = APP.zoneIds();
      if (person && allowed.length && allowed.length < all.length) {
        var labels = allowed.map(function (z) { return (zones[z] && zones[z].label) || z; });
        elig.hidden = false;
        elig.textContent = 'You can be seated in: ' + U.joinList(labels) +
          '. Desks elsewhere are shown crossed out on the plan.';
      } else {
        elig.hidden = true;
        elig.textContent = '';
      }
    }
  }

  /* ----------------------------------------------------------------------
     Drag reordering — pointer events, with a touch-event fallback.

     The handle is the drag source (Style.html already gives it
     touch-action: none). The pointer is captured on the list, not on the row,
     because the dragged row is hidden mid-drag; the list element survives the
     re-render that ends the gesture.
     ---------------------------------------------------------------------- */

  /* Returns true when a drag actually started, so the caller only attaches
     move/up listeners it will get to remove again. */
  function beginDrag(row, clientY, src) {
    var list = $('picks-list');
    if (!list || drag) { return false; }
    var rows = toArray(list.querySelectorAll('.pick[data-desk-id]'));
    var from = rows.indexOf(row);
    if (from < 0 || rows.length < 2) { return false; }

    var rects = rows.map(function (r) { return r.getBoundingClientRect(); });

    var ghost = row.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.className = 'pick pick-ghost';
    ghost.setAttribute('data-rank', row.getAttribute('data-rank') || '');
    ghost.style.width = rects[from].width + 'px';
    ghost.style.left = rects[from].left + 'px';
    ghost.style.top = rects[from].top + 'px';
    doc.body.appendChild(ghost);

    drag = {
      id: row.getAttribute('data-desk-id'),
      row: row, rows: rows, rects: rects,
      from: from, to: from, ghost: ghost,
      grabDy: clientY - rects[from].top,
      y: clientY,
      startScroll: global.pageYOffset || doc.documentElement.scrollTop || 0,
      src: src, raf: 0
    };

    row.classList.add('is-dragging');
    doc.body.style.userSelect = 'none';
    live('Moving ' + APP.deskTitle(drag.id) + '. Drag up or down, then let go.');
    autoscroll();
    return true;
  }

  function dragTargetIndex() {
    var scrolled = (global.pageYOffset || doc.documentElement.scrollTop || 0) - drag.startScroll;
    var y = drag.y + scrolled;
    var idx = 0;
    for (var k = 0; k < drag.rows.length; k++) {
