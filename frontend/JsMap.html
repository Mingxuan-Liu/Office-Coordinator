      if (k === drag.from) { continue; }
      var r = drag.rects[k];
      if (y > r.top + r.height / 2) { idx++; }
    }
    return idx;
  }

  /* Rows are not all the same height (a badge adds a line), so each displaced
     row is moved by the pitch to its actual neighbour rather than by one
     nominal row height. */
  function shiftFor(k) {
    var r = drag.rects;
    if (drag.to > drag.from && k > drag.from && k <= drag.to) {
      return -(r[k].top - r[k - 1].top);
    }
    if (drag.to < drag.from && k >= drag.to && k < drag.from) {
      return r[k + 1].top - r[k].top;
    }
    return 0;
  }

  function applyShift() {
    for (var k = 0; k < drag.rows.length; k++) {
      if (k === drag.from) { continue; }
      var t = shiftFor(k);
      drag.rows[k].classList.add('is-shifting');
      drag.rows[k].style.transform = t ? 'translateY(' + t + 'px)' : '';
    }
  }

  function onDragMove(clientY) {
    if (!drag) { return; }
    drag.y = clientY;
    drag.ghost.style.top = (clientY - drag.grabDy) + 'px';
    var to = dragTargetIndex();
    if (to !== drag.to) {
      drag.to = to;
      applyShift();
      drag.ghost.setAttribute('data-rank', String(to + 1));
      var badge = drag.ghost.querySelector('.pick__rank');
      if (badge) { badge.textContent = String(to + 1); }
    }
  }

  function autoscroll() {
    if (!drag) { return; }
    var vh = global.innerHeight || doc.documentElement.clientHeight;
    var d = 0;
    if (drag.y < AUTOSCROLL_EDGE) {
      d = -((AUTOSCROLL_EDGE - drag.y) / AUTOSCROLL_EDGE) * AUTOSCROLL_SPEED;
    } else if (drag.y > vh - AUTOSCROLL_EDGE) {
      d = ((drag.y - (vh - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE) * AUTOSCROLL_SPEED;
    }
    if (d) { global.scrollBy(0, d); onDragMove(drag.y); }
    drag.raf = global.requestAnimationFrame(autoscroll);
  }

  function endDrag(commit) {
    if (!drag) { return; }
    var d = drag;
    drag = null;

    if (d.raf) { global.cancelAnimationFrame(d.raf); }
    detachDrag(d.src);
    if (d.ghost && d.ghost.parentNode) { d.ghost.parentNode.removeChild(d.ghost); }
    d.rows.forEach(function (r) {
      r.classList.remove('is-shifting');
      r.style.transform = '';
    });
    d.row.classList.remove('is-dragging');
    doc.body.style.userSelect = '';

    if (commit && d.to !== d.from) {
      pendingFocus = '.pick[data-desk-id="' + cssEscape(d.id) + '"] .pick__handle';
      APP.movePick(d.from, d.to);
      live(APP.deskTitle(d.id) + ' is now your ' + ordinal(d.to + 1) + ' choice.');
    } else {
      renderPicks();
      live('Move cancelled.');
    }
  }

  function detachDrag(src) {
    if (!src) { return; }
    src.target.removeEventListener(src.move, src.onMove, src.opts);
    src.target.removeEventListener(src.up, src.onUp, src.opts);
    if (src.cancel) { src.target.removeEventListener(src.cancel, src.onCancel, src.opts); }
    if (src.release) { src.release(); }
  }

  function wireDrag() {
    var list = $('picks-list');
    if (!list) { return; }

    function handleFor(target) {
      var h = closest(target, '.pick__handle');
      if (!h) { return null; }
      var row = closest(h, '.pick');
      return (row && row.getAttribute('data-desk-id')) ? { handle: h, row: row } : null;
    }

    function attach(src) {
      src.target.addEventListener(src.move, src.onMove, src.opts);
      src.target.addEventListener(src.up, src.onUp, src.opts);
      if (src.cancel) { src.target.addEventListener(src.cancel, src.onCancel, src.opts); }
    }

    if (global.PointerEvent) {
      list.addEventListener('pointerdown', function (e) {
        if (e.button !== undefined && e.button > 0) { return; }
        var found = handleFor(e.target);
        if (!found || drag) { return; }
        e.preventDefault();
        var pid = e.pointerId;
        var src = {
          target: list, move: 'pointermove', up: 'pointerup', cancel: 'pointercancel',
          opts: { passive: false }
        };
        src.onMove = function (ev) {
          if (ev.pointerId !== pid) { return; }
          if (ev.cancelable) { ev.preventDefault(); }
          onDragMove(ev.clientY);
        };
        src.onUp = function (ev) { if (ev.pointerId === pid) { endDrag(true); } };
        src.onCancel = function (ev) { if (ev.pointerId === pid) { endDrag(false); } };
        if (!beginDrag(found.row, e.clientY, src)) { return; }
        /* Capture on the list, not the row: the row is hidden for the length
           of the drag and is replaced wholesale when it ends. */
        try { list.setPointerCapture(pid); } catch (err) { /* ignore */ }
        src.release = function () { try { list.releasePointerCapture(pid); } catch (e2) {} };
        attach(src);
      });
      return;
    }

    /* Pointer Events missing (older iOS Safari): touch and mouse by hand. */
    list.addEventListener('touchstart', function (e) {
      var found = handleFor(e.target);
      if (!found || drag || e.touches.length !== 1) { return; }
      e.preventDefault();
      var src = {
        target: doc, move: 'touchmove', up: 'touchend', cancel: 'touchcancel',
        opts: { passive: false }
      };
      src.onMove = function (ev) {
        if (ev.cancelable) { ev.preventDefault(); }
        if (ev.touches[0]) { onDragMove(ev.touches[0].clientY); }
      };
      src.onUp = function () { endDrag(true); };
      src.onCancel = function () { endDrag(false); };
      if (beginDrag(found.row, e.touches[0].clientY, src)) { attach(src); }
    }, { passive: false });

    list.addEventListener('mousedown', function (e) {
      if (e.button !== 0) { return; }
      var found = handleFor(e.target);
      if (!found || drag) { return; }
      e.preventDefault();
      var src = { target: doc, move: 'mousemove', up: 'mouseup', cancel: null, opts: false };
      src.onMove = function (ev) { onDragMove(ev.clientY); };
      src.onUp = function () { endDrag(true); };
      if (beginDrag(found.row, e.clientY, src)) { attach(src); }
    });
  }

  /* ----------------------------------------------------------------------
     Wiring
     ---------------------------------------------------------------------- */

  function wireList() {
    var list = $('picks-list');
    if (!list) { return; }

    list.addEventListener('click', function (e) {
      var btn = closest(e.target, '[data-act]');
      var row = closest(e.target, '.pick[data-desk-id]');
      if (!row) { return; }
      var id = row.getAttribute('data-desk-id');
      var act = btn && btn.getAttribute('data-act');

      if (act === 'up' || act === 'down') {
        pendingFocus = '.pick[data-desk-id="' + cssEscape(id) + '"] [data-act="' + act + '"]';
        if (APP.movePickBy(id, act === 'up' ? -1 : 1)) {
          live(APP.deskTitle(id) + ' is now your ' + ordinal(APP.rankOf(id)) + ' choice.');
        } else {
          pendingFocus = null;
        }
        return;
      }
      if (act === 'remove') {
        var was = APP.rankOf(id);
        APP.removePick(id);
        live(APP.deskTitle(id) + ' removed from rank ' + was + '.');
        return;
      }
      if (act === 'grab') { return; }

      /* Clicking the row itself points at the desk on the plan. */
      var d = APP.deskById(id);
      if (d && String(d.roomId) !== String(activeRoomId)) { switchRoom(d.roomId); }
      centerOnDesk(id, true);
      setLinked(id);
    });

    /* Arrow keys on the handle reorder without needing a pointer at all. */
    list.addEventListener('keydown', function (e) {
      var h = closest(e.target, '.pick__handle');
      if (!h) { return; }
      var dir = e.key === 'ArrowUp' ? -1 : (e.key === 'ArrowDown' ? 1 : 0);
      if (!dir) { return; }
      e.preventDefault();
      var row = closest(h, '.pick');
      var id = row && row.getAttribute('data-desk-id');
      if (!id) { return; }
      pendingFocus = '.pick[data-desk-id="' + cssEscape(id) + '"] .pick__handle';
      if (APP.movePickBy(id, dir)) {
        live(APP.deskTitle(id) + ' is now your ' + ordinal(APP.rankOf(id)) + ' choice.');
      } else {
        pendingFocus = null;
      }
    });

    list.addEventListener('mouseover', function (e) {
      var row = closest(e.target, '.pick[data-desk-id]');
      if (row) { setLinked(row.getAttribute('data-desk-id')); }
    });
    list.addEventListener('mouseleave', function () { if (!drag) { setLinked(null); } });
    list.addEventListener('focusin', function (e) {
      var row = closest(e.target, '.pick[data-desk-id]');
      if (row) { setLinked(row.getAttribute('data-desk-id')); }
    });
  }

  function wireMap() {
    var svg = $('map-svg');
    var stage = $('map-stage');
    if (!svg || !stage) { return; }

    function deskIdFrom(target) {
      var n = closest(target, '[data-desk-id]');
      return n ? n.getAttribute('data-desk-id') : null;
    }

    svg.addEventListener('click', function (e) {
      var id = deskIdFrom(e.target);
      if (!id) { return; }
      setFocusDesk(id, false);
      activateDesk(id);
      /* Keep the tooltip honest about the new state. */
      if (deskNodes[id]) { showTipFor(id); }
    });

    svg.addEventListener('keydown', function (e) {
      var id = deskIdFrom(e.target);
      if (!id) { return; }
      var key = e.key;
      if (key === 'Enter' || key === ' ' || key === 'Spacebar') {
        e.preventDefault();
        activateDesk(id);
        showTipFor(id);
        return;
      }
      var dir = null;
      if (key === 'ArrowRight') { dir = [1, 0]; }
      else if (key === 'ArrowLeft') { dir = [-1, 0]; }
      else if (key === 'ArrowDown') { dir = [0, 1]; }
      else if (key === 'ArrowUp') { dir = [0, -1]; }
      if (dir) { e.preventDefault(); moveFocusDirection(dir[0], dir[1]); return; }
      if (key === 'Home' && deskOrder.length) { e.preventDefault(); setFocusDesk(deskOrder[0], true); return; }
      if (key === 'End' && deskOrder.length) { e.preventDefault(); setFocusDesk(deskOrder[deskOrder.length - 1], true); return; }
      if (key === 'Escape') { hideTip(); }
    });

    svg.addEventListener('mouseover', function (e) {
      var id = deskIdFrom(e.target);
      if (id) { setLinked(id); showTipFor(id); }
    });
    svg.addEventListener('mouseout', function (e) {
      var id = deskIdFrom(e.target);
      var to = e.relatedTarget ? closest(e.relatedTarget, '[data-desk-id]') : null;
      if (id && (!to || to.getAttribute('data-desk-id') !== id)) { setLinked(null); hideTip(); }
    });

    /* Structure notes on hover. The features are pointer-events: none, so the
       pointer is resolved against their geometry rather than against the DOM —
       the desks keep every event they would otherwise have received. */
    svg.addEventListener('mousemove', function (e) {
      if (drag || pinch) { return; }
      if (deskIdFrom(e.target)) { return; }      /* the desk handlers own this */
      var rec = featureAt(e.clientX, e.clientY);
      if (rec) { showFeatureTip(rec); }
      else if (tipFeatureId) { hideTip(); }
    });
    svg.addEventListener('mouseleave', function () {
      if (tipFeatureId) { hideTip(); }
    });
    svg.addEventListener('focusin', function (e) {
      var id = deskIdFrom(e.target);
      if (id) { setFocusDesk(id, false); setLinked(id); showTipFor(id); }
    });
    svg.addEventListener('focusout', function () { hideTip(); setLinked(null); });

    stage.addEventListener('scroll', function () {
      if (tipFor) { showTipFor(tipFor); }
      else if (tipFeatureId) { hideTip(); }
    }, { passive: true });

    /* Zoom buttons. */
    var zi = $('map-zoom-in'), zo = $('map-zoom-out'), zf = $('map-zoom-fit');
    if (zi) { zi.addEventListener('click', function () { setZoom(view.zoom * ZOOM_STEP); }); }
    if (zo) { zo.addEventListener('click', function () { setZoom(view.zoom / ZOOM_STEP); }); }
    if (zf) { zf.addEventListener('click', function () { setZoom(1); }); }

    /* Trackpad pinch / ctrl+wheel. Plain wheel keeps scrolling the stage. */
    stage.addEventListener('wheel', function (e) {
      if (!e.ctrlKey && !e.metaKey) { return; }
      e.preventDefault();
      setZoom(view.zoom * Math.pow(0.99, e.deltaY), e.clientX, e.clientY);
    }, { passive: false });

    /* Two-finger pinch. */
    stage.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2) { return; }
      var a = e.touches[0], b = e.touches[1];
      pinch = {
        dist: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
        zoom: view.zoom
      };
      hideTip();
    }, { passive: true });

    stage.addEventListener('touchmove', function (e) {
      if (!pinch || e.touches.length !== 2) { return; }
      if (e.cancelable) { e.preventDefault(); }
      var a = e.touches[0], b = e.touches[1];
      var d = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      if (!pinch.dist) { return; }
      setZoom(pinch.zoom * (d / pinch.dist),
              (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    }, { passive: false });

    stage.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) { pinch = null; }

      /* Double-tap to zoom, but only on empty plan — a second tap on a desk
         has to mean "remove it", not "zoom". */
      if (e.changedTouches.length !== 1 || e.touches.length !== 0) { return; }
      var t = e.changedTouches[0];
      if (closest(t.target, '[data-desk-id]')) { lastTap.t = 0; return; }
      var now = Date.now();
      if (now - lastTap.t < DBLTAP_MS &&
          Math.abs(t.clientX - lastTap.x) < DBLTAP_PX &&
          Math.abs(t.clientY - lastTap.y) < DBLTAP_PX) {
        if (e.cancelable) { e.preventDefault(); }
        setZoom(view.zoom > 1.05 ? 1 : DBLTAP_ZOOM, t.clientX, t.clientY);
        lastTap.t = 0;
      } else {
        lastTap.t = now; lastTap.x = t.clientX; lastTap.y = t.clientY;
      }
    }, { passive: false });
  }

  function wireRoomTabs() {
    var host = $('map-rooms');
    if (!host) { return; }
    host.addEventListener('click', function (e) {
      var tab = closest(e.target, '[data-room-id]');
      if (tab) { switchRoom(tab.getAttribute('data-room-id')); }
    });
    host.addEventListener('keydown', function (e) {
      var tabs = toArray(host.querySelectorAll('[data-room-id]'));
      if (!tabs.length) { return; }
      var i = tabs.indexOf(closest(e.target, '[data-room-id]'));
      if (i < 0) { return; }
      var j = -1;
      if (e.key === 'ArrowRight') { j = (i + 1) % tabs.length; }
      else if (e.key === 'ArrowLeft') { j = (i - 1 + tabs.length) % tabs.length; }
      else if (e.key === 'Home') { j = 0; }
      else if (e.key === 'End') { j = tabs.length - 1; }
      if (j < 0) { return; }
      e.preventDefault();
      switchRoom(tabs[j].getAttribute('data-room-id'));
      var again = host.querySelectorAll('[data-room-id]')[j];
      if (again) { again.focus(); }
    });
  }

  function wireChrome() {
    var clear = $('picks-clear');
    if (clear) {
      clear.addEventListener('click', function () {
        if (!APP.state.picks.length) { return; }
        var n = APP.state.picks.length;
        APP.clearPicks();
        live('Cleared ' + n + ' ranked desk' + (n === 1 ? '' : 's') + '.');
      });
    }
    var back = $('select-back');
    if (back) { back.addEventListener('click', function () { APP.go('explainer'); }); }
    var cont = $('select-continue');
    if (cont) {
      cont.addEventListener('click', function () {
        /* Hand off only. Nothing here writes to the server. */
        APP.go('confirm');
      });
    }
  }

  function wireResize() {
    var stage = $('map-stage');
    if (!stage) { return; }
    var pending = false;
    function onResize() {
      if (pending) { return; }
      pending = true;
      global.requestAnimationFrame(function () {
        pending = false;
        if (APP.state.view === 'select') { measure(); }
      });
    }
    global.addEventListener('resize', onResize);
    global.addEventListener('orientationchange', onResize);
    if (global.ResizeObserver) {
      try { new global.ResizeObserver(onResize).observe(stage); } catch (e) { /* ignore */ }
    }
  }

  function wireOnce() {
    if (wired) { return; }
    wired = true;
    wireMap();
    wireList();
    wireDrag();
    wireRoomTabs();
    wireChrome();
    wireResize();
    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hideTip(); }
    });
  }

  /* ----------------------------------------------------------------------
     Render orchestration
     ---------------------------------------------------------------------- */

  function ensureBuilt() {
    var wantRoom = pickInitialRoom();
    if (wantRoom === null) {
      buildRoom(null);
      return;
    }
    if (builtFor !== wantRoom) { buildRoom(wantRoom); }
  }

  function renderAll() {
    renderRoomTabs();
    renderLegend();
    paintDesks();
    paintHint();
    /* Everything below lives in #view-select and means nothing on the pre-lock
       step, which has no ranking, no K and no validation strip. */
    if (isSingle()) { return; }
    renderHeader();
    renderPicks();
    renderValidation();
    renderConcentration();
  }

  function isActive() { return APP.state.view === hostView; }

  /* ----------------------------------------------------------------------
     Mounting — how the pre-lock step borrows this renderer

     #map-wrap is moved, not copied. Every id inside it stays what it was, so
     every listener attached in wireOnce() and every measurement below keeps
     working; there is no second renderer to keep in step with this one.
     ---------------------------------------------------------------------- */

  function rememberHome() {
    var wrap = $('map-wrap');
    if (!wrap || mapHome) { return wrap; }
    mapHome = { parent: wrap.parentNode, next: wrap.nextSibling };
    return wrap;
  }

  function relayout() {
    measure(true);
    /* Layout settles a frame later on some mobile browsers. */
    global.requestAnimationFrame(function () { measure(); });
  }

  /* opts: {view, mode, selected, onPick, liveRegion, hint} */
  function mountMap(slot, opts) {
    opts = opts || {};
    var wrap = rememberHome();
    if (!wrap) { return null; }

    mode = (opts.mode === MODE_SINGLE) ? MODE_SINGLE : MODE_RANK;
    hostView = opts.view || (isSingle() ? 'prelock' : 'select');
    liveId = opts.liveRegion || (isSingle() ? 'prelock-live' : 'select-live');
    single.onPick = typeof opts.onPick === 'function' ? opts.onPick : null;
    single.hint = opts.hint || '';
    single.id = opts.selected || null;

    if (slot && wrap.parentNode !== slot) { slot.appendChild(wrap); }

    wireOnce();
    /* Rebuild rather than re-use: the stage is a different size in a different
       container, and the mode changes what every desk is painted as. */
    builtFor = null;
    ensureBuilt();
    renderAll();
    relayout();
    return wrap;
  }

  /* Puts the map back where ViewSelect declared it and restores rank mode. */
  function unmountMap() {
    hideTip();
    setLinked(null);
    mode = MODE_RANK;
    hostView = 'select';
    liveId = 'select-live';
    single.id = null;
    single.onPick = null;
    single.hint = '';

    var wrap = $('map-wrap');
    if (wrap && mapHome && wrap.parentNode !== mapHome.parent) {
      mapHome.parent.insertBefore(wrap, mapHome.next);
    }
    builtFor = null;
    paintHint();
  }

  APP.map = {
    mount: mountMap,
    unmount: unmountMap,
    mode: function () { return mode; },
    selection: function () { return single.id; },
    setSelection: function (id) {
      single.id = id || null;
      if (isSingle()) { paintDesks(); renderRoomTabs(); }
      return single.id;
    },
    redraw: function () { if (isActive()) { renderAll(); } },
    relayout: relayout
  };

  APP.on('select', {
    onEnter: function () {
      wireOnce();
      rememberHome();
      /* Coming back from the pre-lock step, the map is still in that view's
         slot. Putting it back is what makes the two steps share one renderer. */
      if (mode !== MODE_RANK || ($('map-wrap') && mapHome &&
          $('map-wrap').parentNode !== mapHome.parent)) {
        unmountMap();
      }
      ensureBuilt();
      renderAll();
      measure();
      global.requestAnimationFrame(function () { measure(); });
    },
    onLeave: function () {
      hideTip();
      setLinked(null);
      if (drag) { endDrag(false); }
    }
  });

  APP.listen('bootstrap:ready', function () {
    wireOnce();
    builtFor = null;
    if (!roomById(activeRoomId)) { activeRoomId = null; }
    if (isActive()) {
      ensureBuilt();
      renderAll();
      measure(true);
    }
  });

  APP.listen('person:set', function () {
    if (!isActive()) { builtFor = null; return; }
    renderAll();
  });

  APP.listen('picks:changed', function () {
    if (isSingle()) { return; }          /* the pre-lock step has no ranking */
    if (!isActive() && builtFor === null) { return; }
    paintDesks();
    renderPicks();
    renderValidation();
    renderConcentration();
    renderRoomTabs();
  });

  APP.listen('zones:changed', function () {
    if (isActive()) { renderLegend(); }
  });

  APP.listen('deadline:passed', function () {
    if (isActive()) { renderValidation(); }
  });

}(window, document));
</script>
